      });
    }

    async function renderReviewPanel() {
      const panel = document.getElementById("reviewPanel");
      const submission = state.reviewSubmission;
      if (!panel || !submission) return;
      state.reviewZoom = 1;
      const feedback = normalizeFeedback(submission.teacherStrokes);
      state.reviewPhotoIndex = clamp(feedback.photoIndex, 0, Math.max(0, (submission.imageFileIds || []).length - 1));
      state.reviewStrokes = JSON.parse(JSON.stringify(feedback.strokes || []));
      state.reviewComment = submission.teacherComment || "";
       panel.innerHTML = "<div class=\"review-meta\"><div><p class=\"eyebrow\">" + escapeHtml(areaTitle(submission.areaId)) + "</p><h2>" + escapeHtml(submission.nickname || "未填暱稱") + "的作答</h2><p>送出於 " + escapeHtml(formatTime(submission.createdAt)) + "，最近更新於 " + escapeHtml(formatTime(submission.updatedAt)) + "</p></div><span class=\"meta-chip\">" + escapeHtml(submission.status || "待批改") + "</span></div><div class=\"review-toolbar\"><label>筆色 <input type=\"color\" id=\"reviewColorField\" value=\"" + escapeHtml(state.reviewColor) + "\"></label><label>粗細 <span class=\"review-width-selector\"><button class=\"review-width-btn\" data-review-width=\"2\" type=\"button\">2</button><button class=\"review-width-btn active\" data-review-width=\"4\" type=\"button\">4</button><button class=\"review-width-btn\" data-review-width=\"6\" type=\"button\">6</button><button class=\"review-width-btn\" data-review-width=\"8\" type=\"button\">8</button></span></label><div class=\"toolbar-group review-zoom-group\"><button class=\"toolbar-button\" id=\"reviewZoomOutButton\" type=\"button\" title=\"縮小\">−</button><span class=\"toolbar-label\" id=\"reviewZoomLabel\">100％</span><button class=\"toolbar-button\" id=\"reviewZoomInButton\" type=\"button\" title=\"放大\">＋</button><button class=\"toolbar-button\" id=\"reviewZoomFitButton\" type=\"button\" title=\"原始大小\">適合</button></div><button class=\"button small subtle\" id=\"undoStrokeButton\" type=\"button\">復原一筆</button><button class=\"button small danger\" id=\"clearStrokesButton\" type=\"button\">清除筆跡</button></div><div class=\"photo-tabs\" id=\"reviewPhotoTabs\"></div><div class=\"review-image-stage\" id=\"reviewImageStage\"><div class=\"inline-message\">正在載入答案照片……</div></div><div class=\"review-text-answer\"><strong>文字答案</strong><br>" + escapeHtml(submission.text || "學生沒有另外輸入文字。") + "</div><div class=\"review-bottom\"><div><label for=\"teacherCommentField\" class=\"helper\">教師評語</label><textarea id=\"teacherCommentField\" maxlength=\"1000\" placeholder=\"寫下給學生的提醒或回饋……\">" + escapeHtml(state.reviewComment) + "</textarea></div><div class=\"review-bottom-actions\"><button class=\"button small danger\" id=\"deleteSubmissionButton\" type=\"button\">刪除此作答</button><button class=\"button small\" id=\"exportCurrentButton\" type=\"button\">下載批改圖</button><button class=\"button primary small\" id=\"saveFeedbackButton\" type=\"button\">儲存教師批改</button></div></div>";
       const reviewMeta = panel.querySelector(".review-meta");
       if (reviewMeta) reviewMeta.remove();
      const exportButton = document.getElementById("exportCurrentButton");
      if (exportButton) exportButton.remove();
      setupReviewInkControls();
      document.getElementById("reviewColorField").addEventListener("input", function (event) { state.reviewColor = event.target.value; });
      panel.querySelectorAll("[data-review-width]").forEach(function (btn) {
        btn.classList.toggle("active", Number(btn.dataset.reviewWidth) === state.reviewWidth);
        btn.addEventListener("click", function () {
          state.reviewWidth = Number(btn.dataset.reviewWidth) || 4;
          panel.querySelectorAll("[data-review-width]").forEach(function (item) {
            item.classList.toggle("active", Number(item.dataset.reviewWidth) === state.reviewWidth);
          });
        });
      });
      document.getElementById("reviewZoomOutButton").addEventListener("click", function () { setReviewZoom((state.reviewZoom || 1) - 0.2); });
      document.getElementById("reviewZoomInButton").addEventListener("click", function () { setReviewZoom((state.reviewZoom || 1) + 0.2); });
      document.getElementById("reviewZoomFitButton").addEventListener("click", function () { setReviewZoom(1.0); });
      document.getElementById("undoStrokeButton").addEventListener("click", function () { state.reviewStrokes.pop(); drawReviewCanvas(); });
      document.getElementById("clearStrokesButton").addEventListener("click", clearReviewStrokes);
      document.getElementById("deleteSubmissionButton").addEventListener("click", deleteReviewSubmission);
      document.getElementById("teacherCommentField").addEventListener("input", function (event) { state.reviewComment = event.target.value; });
      document.getElementById("saveFeedbackButton").addEventListener("click", saveReviewFeedback);
      await loadReviewImages();
    }

    function setupReviewInkControls() {
      const toolbar = document.querySelector(".review-toolbar");
      if (!toolbar) return;
      if (!document.getElementById("reviewToolPen")) {
        const controls = document.createElement("div");
        controls.id = "reviewInkControls";
        controls.className = "ink-controls review-ink-controls";
        controls.innerHTML = "<button class=\"ink-icon-button active\" data-review-tool=\"pen\" type=\"button\" title=\"手寫筆\" aria-label=\"手寫筆\">✎</button><button class=\"ink-icon-button\" id=\"reviewToolPen\" data-review-tool=\"pen\" type=\"button\" style=\"display:none\"></button><button class=\"ink-icon-button\" data-review-tool=\"highlighter\" type=\"button\" title=\"螢光筆\" aria-label=\"螢光筆\">▰</button><button class=\"ink-icon-button\" data-review-tool=\"shape\" type=\"button\" title=\"圖形\" aria-label=\"圖形\">◇</button><span class=\"ink-shape-buttons\" id=\"reviewShapeButtons\" hidden><button class=\"ink-icon-button\" data-review-shape=\"arrow\" type=\"button\" title=\"箭頭\" aria-label=\"箭頭\">➜</button><button class=\"ink-icon-button\" data-review-shape=\"line\" type=\"button\" title=\"直線\" aria-label=\"直線\">╱</button><button class=\"ink-icon-button\" data-review-shape=\"rect\" type=\"button\" title=\"矩形\" aria-label=\"矩形\">□</button><button class=\"ink-icon-button\" data-review-shape=\"circle\" type=\"button\" title=\"圓形\" aria-label=\"圓形\">○</button></span><button class=\"ink-icon-button\" data-review-tool=\"eraser\" type=\"button\" title=\"橡皮擦\" aria-label=\"橡皮擦\">⌫</button><span class=\"ink-palette\" aria-label=\"常用顏色\"><button class=\"ink-swatch active\" data-review-color=\"#c47f78\" style=\"background:#c47f78\" type=\"button\" title=\"豆沙玫瑰\" aria-label=\"豆沙玫瑰\"></button><button class=\"ink-swatch\" data-review-color=\"#9eaaa0\" style=\"background:#9eaaa0\" type=\"button\" title=\"鼠尾草綠\" aria-label=\"鼠尾草綠\"></button><button class=\"ink-swatch\" data-review-color=\"#91a6b5\" style=\"background:#91a6b5\" type=\"button\" title=\"霧藍\" aria-label=\"霧藍\"></button><button class=\"ink-swatch\" data-review-color=\"#a99db8\" style=\"background:#a99db8\" type=\"button\" title=\"灰紫\" aria-label=\"灰紫\"></button><button class=\"ink-swatch\" data-review-color=\"#c1a477\" style=\"background:#c1a477\" type=\"button\" title=\"奶茶棕\" aria-label=\"奶茶棕\"></button></span>";
        toolbar.insertBefore(controls, toolbar.firstChild);
        controls.querySelectorAll("[data-review-tool]").forEach(function (btn) {
          if (btn.id === "reviewToolPen") return;
          btn.addEventListener("click", function () {
            state.reviewTool = btn.dataset.reviewTool;
            updateReviewInkControls();
          });
        });
        controls.querySelectorAll("[data-review-shape]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            state.reviewShape = btn.dataset.reviewShape;
            updateReviewInkControls();
          });
        });
        controls.querySelectorAll("[data-review-color]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            state.reviewColor = btn.dataset.reviewColor;
            const colorField = document.getElementById("reviewColorField");
            if (colorField) colorField.value = state.reviewColor;
            updateReviewInkControls();
          });
        });
      }
      updateReviewInkControls();
    }

    function updateReviewInkControls() {
      document.querySelectorAll("[data-review-tool]").forEach(function (item) {
        if (item.id === "reviewToolPen") return;
        item.classList.toggle("active", item.dataset.reviewTool === state.reviewTool);
      });
      document.querySelectorAll("[data-review-shape]").forEach(function (item) {
        item.classList.toggle("active", item.dataset.reviewShape === state.reviewShape);
      });
      document.querySelectorAll("[data-review-color]").forEach(function (item) {
        item.classList.toggle("active", item.dataset.reviewColor && item.dataset.reviewColor.toLowerCase() === state.reviewColor.toLowerCase());
      });
      const shapeButtons = document.getElementById("reviewShapeButtons");
      if (shapeButtons) shapeButtons.hidden = state.reviewTool !== "shape";
      const colorField = document.getElementById("reviewColorField");
      if (colorField) colorField.value = state.reviewColor;
    }

    async function loadReviewImages() {
      const submission = state.reviewSubmission;
      const tabs = document.getElementById("reviewPhotoTabs");
      const stage = document.getElementById("reviewImageStage");
      if (!submission || !tabs || !stage) return;
      const ids = Array.isArray(submission.imageFileIds) ? submission.imageFileIds : [];
      if (!ids.length) {
        tabs.innerHTML = "";
        stage.innerHTML = "<div class=\"inline-message\">這筆作答沒有照片，請使用文字答案與教師評語批改。</div>";
        return;
      }
      state.reviewImages = await Promise.all(ids.map(async function (id) {
        try { return await fetchFileData(id, state.boardId); } catch (error) { return ""; }
      }));
      tabs.innerHTML = state.reviewImages.map(function (_, index) { return "<button class=\"photo-tab " + (index === state.reviewPhotoIndex ? "active" : "") + "\" data-photo-index=\"" + index + "\" type=\"button\">照片 " + (index + 1) + "</button>"; }).join("");
      tabs.querySelectorAll("[data-photo-index]").forEach(function (button) { button.addEventListener("click", function () { state.reviewPhotoIndex = Number(button.dataset.photoIndex); const feedback = normalizeFeedback(state.reviewSubmission.teacherStrokes); state.reviewStrokes = state.reviewPhotoIndex === feedback.photoIndex ? JSON.parse(JSON.stringify(feedback.strokes || [])) : []; state.reviewZoom = 1; loadReviewImages(); }); });
      const dataUrl = state.reviewImages[state.reviewPhotoIndex];
      if (!dataUrl) { stage.innerHTML = "<div class=\"inline-message\">照片讀取失敗，請稍後重試。</div>"; return; }
      stage.innerHTML = "<div class=\"review-image-wrap\"><img id=\"reviewImage\" src=\"" + dataUrl + "\" alt=\"學生答案照片\"><canvas id=\"reviewCanvas\"></canvas></div>";
      const image = document.getElementById("reviewImage");
      image.onload = function () {
        const canvas = document.getElementById("reviewCanvas");
        sizeAnnotationCanvas(canvas, image);
        drawReviewCanvas();
        bindReviewCanvas(canvas);
        bindReviewPinchZoom(stage);
      };
      if (image.complete) {
        const canvas = document.getElementById("reviewCanvas");
        sizeAnnotationCanvas(canvas, image);
        drawReviewCanvas();
        bindReviewCanvas(canvas);
        bindReviewPinchZoom(stage);
      }
    }

    function bindReviewPinchZoom(stage) {
      if (!stage || stage.dataset.zoomBound === "1") return;
      stage.dataset.zoomBound = "1";
      let initialPinchDistance = 0;
      let initialZoom = 1;
      let lastPinchScale = 1;
      let lastTapTime = 0;

      function getPinchDist(e) {
        if (!e.touches || e.touches.length < 2) return 0;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        return Math.hypot(dx, dy);
      }

      stage.addEventListener("touchstart", function (event) {
        if (event.touches.length === 2) {
          isReviewPinching = true;
          cancelReviewStroke();
          initialPinchDistance = getPinchDist(event);
          initialZoom = state.reviewZoom || 1;
          lastPinchScale = 1;
          const wrap = stage.querySelector(".review-image-wrap");
          if (wrap) {
            wrap.style.transformOrigin = "center top";
            wrap.style.transition = "none";
          }
        }
      }, { passive: false });

      stage.addEventListener("touchmove", function (event) {
        if (event.touches.length === 2 && isReviewPinching && initialPinchDistance > 0) {
          event.preventDefault();
          const currDist = getPinchDist(event);
          if (currDist > 0) {
            lastPinchScale = currDist / initialPinchDistance;
            const targetZoom = clamp(initialZoom * lastPinchScale, 0.6, 4.0);
            const wrap = stage.querySelector(".review-image-wrap");
            if (wrap) {
              wrap.style.transform = "scale(" + (targetZoom / (state.reviewZoom || 1)) + ")";
            }
          }
        }
      }, { passive: false });

      stage.addEventListener("touchend", function (event) {
        if (isReviewPinching) {
          if (event.touches.length < 2) {
            isReviewPinching = false;
            const wrap = stage.querySelector(".review-image-wrap");
            if (wrap) {
              wrap.style.transform = "";
              wrap.style.transition = "";
            }
            if (lastPinchScale && Math.abs(lastPinchScale - 1) > 0.03) {
              setReviewZoom(clamp(initialZoom * lastPinchScale, 0.6, 4.0));
            }
            initialPinchDistance = 0;
            lastPinchScale = 1;
          }
          return;
        }
        if (event.changedTouches.length === 1 && !event.target.closest("textarea, input, select, button")) {
          const now = performance.now();
          if (now - lastTapTime < 300) {
            lastTapTime = 0;
            setReviewZoom(state.reviewZoom > 1.1 ? 1.0 : 1.8);
          } else {
            lastTapTime = now;
          }
        }
      }, { passive: false });

      stage.addEventListener("touchcancel", function () {
        if (isReviewPinching) {
          isReviewPinching = false;
          const wrap = stage.querySelector(".review-image-wrap");
          if (wrap) {
            wrap.style.transform = "";
            wrap.style.transition = "";
          }
        }
        initialPinchDistance = 0;
        lastPinchScale = 1;
      }, { passive: true });

      stage.addEventListener("wheel", function (event) {
        if (event.ctrlKey || event.metaKey) {
          event.preventDefault();
          const delta = -event.deltaY;
          const factor = delta > 0 ? 1.1 : 0.9;
          setReviewZoom(clamp((state.reviewZoom || 1) * factor, 0.6, 4.0));
        }
      }, { passive: false });
    }

    function setReviewZoom(newZoom) {
      state.reviewZoom = clamp(Math.round(newZoom * 100) / 100, 0.6, 4.0);
      const stage = document.getElementById("reviewImageStage");
      if (!stage) return;
      const wrap = stage.querySelector(".review-image-wrap");
      const img = stage.querySelector("#reviewImage");
      const canvas = stage.querySelector("#reviewCanvas");
      const label = document.getElementById("reviewZoomLabel");
      if (label) label.textContent = Math.round(state.reviewZoom * 100) + "％";
      if (!wrap || !img) return;

      if (state.reviewZoom === 1) {
        wrap.style.transform = "";
        img.style.maxWidth = "min(900px, 100%)";
        img.style.maxHeight = "min(62vh, 700px)";
        img.style.width = "auto";
        img.style.height = "auto";
      } else {
        const baseWidth = img.naturalWidth || 800;
        const stageWidth = Math.max(260, stage.clientWidth - 40);
        const refWidth = Math.min(baseWidth, stageWidth);
        const targetWidth = Math.round(refWidth * state.reviewZoom);
        wrap.style.transform = "";
        img.style.maxWidth = "none";
        img.style.maxHeight = "none";
        img.style.width = targetWidth + "px";
        img.style.height = "auto";
      }
      if (canvas && img) {
        sizeAnnotationCanvas(canvas, img);
        drawReviewCanvas();
      }
    }

    function drawReviewCanvas() {
      const canvas = document.getElementById("reviewCanvas");
      if (!canvas) return;
      const strokes = state.reviewStrokes.slice();
      if (reviewActiveStroke) strokes.push(reviewActiveStroke);
      drawTeacherInkStrokes(canvas, strokes);
    }

    function canvasPoint(event, canvas) {
      const rect = canvas.getBoundingClientRect();
      const pressure = (event.pointerType === "pen" && typeof event.pressure === "number" && event.pressure > 0) ? event.pressure : 0.5;
      return { x: clamp((event.clientX - rect.left) / rect.width, 0, 1), y: clamp((event.clientY - rect.top) / rect.height, 0, 1), pressure: pressure };
    }

    let reviewActivePointerId = null;
    let reviewActiveStroke = null;
    let reviewErasing = false;
    let reviewInkChanged = false;
    let isReviewPinching = false;
    let reviewStartTime = 0;
    let reviewStartPoint = null;
    let reviewMoved = false;
    let lastReviewTipTap = null;

    function bindReviewCanvas(canvas) {
      if (!canvas || canvas.dataset.bound === "1") return;
      canvas.dataset.bound = "1";
      canvas.style.touchAction = "none";
      canvas.style.willChange = "transform";
      canvas.addEventListener("pointerdown", function (event) {
        if (reviewActivePointerId !== null || isReviewPinching) return;
        const isPen = event.pointerType === "pen";
        if (event.pointerType === "touch") {
          if (event.isPrimary === false) return;
          if (event.width > 65 && event.height > 65) return;
        }
        event.preventDefault();
        reviewActivePointerId = event.pointerId;
        if (typeof canvas.setPointerCapture === "function") {
          try { canvas.setPointerCapture(event.pointerId); } catch (e) {}
        }
        const point = canvasPoint(event, canvas);
        reviewStartTime = performance.now();
        reviewStartPoint = point;
        reviewMoved = false;
        reviewInkChanged = false;
        if (state.reviewTool === "eraser") {
          reviewErasing = true;
          eraseReviewStrokeAt(point);
          return;
        }
        reviewActiveStroke = { tool: state.reviewTool, shape: state.reviewShape, color: state.reviewColor, width: state.reviewWidth / 800, points: [point] };
        drawReviewCanvas();
      });
      canvas.addEventListener("pointermove", function (event) {
        if (event.pointerId !== reviewActivePointerId) return;
        if (!reviewActiveStroke && !reviewErasing) return;
        event.preventDefault();
        const events = typeof event.getCoalescedEvents === "function" ? event.getCoalescedEvents() : [event];
        if (!events.length) return;
        const lastPoint = canvasPoint(events[events.length - 1], canvas);
        if (reviewStartPoint && Math.hypot(lastPoint.x - reviewStartPoint.x, lastPoint.y - reviewStartPoint.y) > 0.008) {
          reviewMoved = true;
        }
        if (reviewErasing) {
          events.forEach(function (item) { eraseReviewStrokeAt(canvasPoint(item, canvas)); });
          return;
        }
        if (reviewActiveStroke.tool === "shape" || reviewActiveStroke.tool === "highlighter") {
          if (reviewActiveStroke.tool === "shape") {
            reviewActiveStroke.points = [reviewActiveStroke.points[0], lastPoint];
          } else {
            events.forEach(function (item) {
              reviewActiveStroke.points.push(canvasPoint(item, canvas));
            });
          }
          drawReviewCanvas();
        } else {
          events.forEach(function (item) {
            reviewActiveStroke.points.push(canvasPoint(item, canvas));
            drawLiveSegment(canvas, reviewActiveStroke);
          });
        }
      });
      canvas.addEventListener("pointerup", finishReviewStroke);
      canvas.addEventListener("pointercancel", cancelReviewStroke);
    }

    function finishReviewStroke(event) {
      if (event && event.pointerId !== reviewActivePointerId) return;
      reviewActivePointerId = null;
      const duration = performance.now() - reviewStartTime;
      const isTap = !reviewMoved && duration < 240;
      const pt = reviewStartPoint || (reviewActiveStroke && reviewActiveStroke.points[0]) || { x: 0, y: 0 };
      const now = performance.now();
      if (isTap && event && event.pointerType === "pen") {
        if (lastReviewTipTap && (now - lastReviewTipTap.time < 380) && Math.hypot(pt.x - lastReviewTipTap.x, pt.y - lastReviewTipTap.y) < 0.04) {
          lastReviewTipTap = null;
          reviewActiveStroke = null;
          reviewErasing = false;
          reviewInkChanged = false;
          if (state.reviewStrokes.length > 0 && state.reviewStrokes[state.reviewStrokes.length - 1].points.length <= 2) {
            state.reviewStrokes.pop();
          }
          drawReviewCanvas();
          togglePencilEraser();
          return;
        }
        lastReviewTipTap = { x: pt.x, y: pt.y, time: now };
      } else {
        lastReviewTipTap = null;
      }
      if (reviewErasing) {
        reviewErasing = false;
        reviewInkChanged = false;
        return;
      }
      if (!reviewActiveStroke) return;
      state.reviewStrokes.push(reviewActiveStroke);
      reviewActiveStroke = null;
      drawReviewCanvas();
    }

    function cancelReviewStroke(event) {
      if (event && event.pointerId !== reviewActivePointerId) return;
      if (reviewActiveStroke && reviewActiveStroke.points && reviewActiveStroke.points.length > 1) {
        finishReviewStroke(event);
      } else {
        reviewActivePointerId = null;
        reviewActiveStroke = null;
        reviewErasing = false;
        reviewInkChanged = false;
        drawReviewCanvas();
      }
    }

    function eraseReviewStrokeAt(point) {
      const kept = state.reviewStrokes.filter(function (stroke) {
        const strokeW = Number(stroke.width || .005);
        const mult = stroke.tool === "highlighter" ? 6 : 1;
        const threshold = Math.max(0.015, strokeW * mult * 1.6);
        const points = Array.isArray(stroke.points) ? stroke.points : [];
        for (let index = 0; index < points.length; index += 1) {
          if (distanceToSegment(point, points[index], points[index + 1] || points[index]) <= threshold) return false;
        }
        return true;
      });
      if (kept.length !== state.reviewStrokes.length) {
        state.reviewStrokes = kept;
        reviewInkChanged = true;
        drawReviewCanvas();
      }
    }

    async function clearReviewStrokes() {
      const ok = await showModal("清除教師筆跡", "只會清除目前這張答案照片上的批改筆跡，確定嗎？", "confirm");
      if (!ok) return;
      state.reviewStrokes = [];
      drawReviewCanvas();
    }

    async function clearAllReviewStrokes() {
      const ok = await showModal("全部清除答案筆跡", "會清除目前這筆學生答案上的教師批改筆跡，確定嗎？", "confirm");
      if (!ok) return;
      state.reviewStrokes = [];
      drawReviewCanvas();
    }

    async function deleteReviewSubmission() {
      const submission = state.reviewSubmission;
      if (!submission) return;
      const nickname = submission.nickname || "未填暱稱";
      const ok = await showModal("確定要刪除此作答紀錄嗎？", "學生「" + nickname + "」的作答內容、照片與所有批改筆跡將會被永久刪除，無法復原。", "confirm");
      if (!ok) return;

      const deletedId = submission.id;
      try {
        await commitLocalMutation("deleteSubmission", { submissionId: deletedId, boardId: state.boardId });
        state.submissions = state.submissions.filter(function (item) { return String(item.id) !== String(deletedId); });
        (submission.imageFileIds || []).forEach(function (fileId) { state.imageCache.delete(fileId); });

        renderReviewAreaList();
        renderSubmissionList();
        renderZones();

        const remainingRows = reviewRowsForActiveArea();
        if (remainingRows.length) {
          await selectReviewSubmission(remainingRows[0].id);
        } else {
          clearReviewSelection();
        }
        showToast("已成功刪除「" + nickname + "」的作答紀錄。", "success");
      } catch (error) {
        await showModal("刪除作答失敗", error.message || "請稍後再試。", "error");
      }
    }

    async function saveReviewFeedback() {
      const submission = state.reviewSubmission;
      if (!submission) return;
      const payload = { submissionId: submission.id, boardId: state.boardId, strokes: { photoIndex: state.reviewPhotoIndex, strokes: state.reviewStrokes }, comment: state.reviewComment };
      try {
        await localPut("submissions", submission);
        const result = await commitLocalMutation("saveFeedback", payload);
        const localSubmission = result.submission || await localGet("submissions", submission.id);
        if (localSubmission) Object.assign(submission, localSubmission);
        renderSubmissionList();
        await renderReviewPanel();
        showToast(state.demo ? "教師批改已儲存。" : "批改已先儲存在本機，背景同步中。", state.demo ? "success" : "warning");
      } catch (error) {
        await showModal("批改本機保存失敗", error.message || "請稍後再試。", "error");
      }
    }

    async function init() {
      bindStaticEvents();
      setConnectionBadge();
      refreshSheetLink();
      await renderRoute();
      flushOutbox();
    }

    init();
  </script>
