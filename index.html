  <title>墨卷，互動講義批改</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --ink: #263733;
      --muted: #6f7d77;
      --paper: #fffdf8;
      --canvas: #e9e6dd;
      --panel: #ffffff;
      --line: #e1ded4;
      --accent: #d76d50;
      --accent-dark: #a94c35;
      --teal: #315f59;
      --teal-dark: #214842;
      --teal-soft: #e2eeea;
      --gold: #c79245;
      --danger: #b64f4f;
      --shadow: 0 18px 50px rgba(44, 52, 47, 0.1);
      --shadow-soft: 0 8px 22px rgba(44, 52, 47, 0.08);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
    }
    html, body {
      margin: 0;
      min-height: 100%;
      -webkit-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    input, textarea, [contenteditable="true"] {
      -webkit-user-select: text;
      user-select: text;
    }
    img, canvas, .page-stage, .pdf-scroll, .review-image-stage, .review-image-wrap, .zone-layer {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
    }
    body {
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(255,255,255,.75), transparent 32rem),
        var(--canvas);
      font-family: "Noto Sans TC", system-ui, -apple-system, "Microsoft JhengHei", sans-serif;
      font-size: 15px;
      line-height: 1.6;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    a { color: inherit; }
    .app-shell { min-height: 100vh; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 72px;
      padding: 12px clamp(16px, 4vw, 54px);
      background: rgba(255, 253, 248, .92);
      border-bottom: 1px solid rgba(225, 222, 212, .9);
      backdrop-filter: blur(16px);
    }
    .brand {
      display: inline-flex;
      align-items: baseline;
      gap: 10px;
      color: var(--teal-dark);
      font-family: Georgia, "Noto Serif TC", serif;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: .04em;
      text-decoration: none;
      white-space: nowrap;
    }
    .brand span { color: var(--muted); font-family: inherit; font-size: 13px; font-weight: 400; letter-spacing: .08em; }
    .topbar-actions { display: flex; align-items: center; gap: 8px; }
    .connection-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      padding: 5px 11px;
      color: var(--muted);
      background: #f4f1e9;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
    }
    .connection-badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
    .connection-badge.is-online::before { background: #5c9b70; }
    .connection-badge.is-demo::before { background: var(--accent); }
    .icon-button, .top-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      min-height: 44px;
      padding: 8px 13px;
      color: var(--teal-dark);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 12px;
      transition: background .15s ease, border-color .15s ease, transform .15s ease;
    }
    .icon-button:hover, .top-button:hover { background: var(--teal-soft); border-color: #c5d9d2; }
    .icon-button:active, .top-button:active, .button:active { transform: scale(.97); }
    .icon-button { font-size: 20px; }
    #__sheetLink { display: none; opacity: .35; transition: opacity .15s ease; }
    #__sheetLink:hover { opacity: 1; }

    main { width: min(1480px, 100%); margin: 0 auto; padding: clamp(22px, 4vw, 52px); }
    .page-intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 22px; margin-bottom: 30px; }
    .eyebrow { margin: 0 0 8px; color: var(--accent-dark); font-size: 12px; font-weight: 700; letter-spacing: .16em; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 10px; color: var(--teal-dark); font-family: Georgia, "Noto Serif TC", serif; font-size: clamp(30px, 4vw, 48px); line-height: 1.12; letter-spacing: .02em; }
    h2 { margin-bottom: 8px; color: var(--teal-dark); font-size: 24px; line-height: 1.25; }
    h3 { margin-bottom: 6px; color: var(--teal-dark); font-size: 17px; }
    .lede { max-width: 700px; margin-bottom: 0; color: var(--muted); font-size: 16px; }
    .page-actions { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 9px; }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 16px;
      color: var(--teal-dark);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      font-weight: 700;
      transition: background .15s ease, border-color .15s ease, color .15s ease, transform .15s ease;
    }
    .button:hover { border-color: #b8cfc7; background: #f8fbf8; }
    .button.primary { color: #fffaf4; background: var(--accent); border-color: var(--accent); box-shadow: 0 8px 18px rgba(215, 109, 80, .2); }
    .button.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
    .button.teal { color: #f5fffb; background: var(--teal); border-color: var(--teal); }
    .button.teal:hover { background: var(--teal-dark); border-color: var(--teal-dark); }
    .button.subtle { color: var(--muted); background: #f7f5ef; }
    .button.danger { color: var(--danger); background: #fff7f4; border-color: #ebc8c2; }
    .button.small { min-height: 38px; padding: 7px 11px; font-size: 13px; }
    .button.full { width: 100%; }
    .button input[type="file"] { display: none; }

    .dashboard-hero {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(260px, .75fr);
      gap: 22px;
      padding: clamp(22px, 4vw, 38px);
      background: linear-gradient(135deg, #fdfbf5 0%, #eef5ef 100%);
      border: 1px solid #dfe8df;
      border-radius: 24px;
      box-shadow: var(--shadow-soft);
    }
    .hero-note { align-self: end; padding: 18px; background: rgba(255,255,255,.66); border: 1px solid rgba(207, 221, 211, .9); border-radius: 16px; }
    .hero-note strong { display: block; margin-bottom: 6px; color: var(--teal-dark); }
    .hero-note p { margin-bottom: 0; color: var(--muted); font-size: 13px; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 35px 0 14px; }
    .section-heading h2 { margin-bottom: 0; font-size: 20px; }
    .section-heading p { margin-bottom: 0; color: var(--muted); font-size: 13px; }
    .board-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .board-card {
      display: flex;
      flex-direction: column;
      min-height: 232px;
      padding: 20px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      animation: fadeIn .3s ease both;
    }
    .board-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .board-mark { display: grid; place-items: center; width: 42px; height: 42px; color: #fff7ee; background: var(--teal); border-radius: 13px; font-family: Georgia, serif; font-size: 21px; }
    .board-card h3 { margin: 15px 0 5px; font-size: 19px; }
    .board-card p { min-height: 48px; margin-bottom: 14px; color: var(--muted); font-size: 13px; }
    .board-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: auto; color: var(--muted); font-size: 12px; }
    .meta-chip { padding: 4px 8px; background: #f6f3ec; border-radius: 999px; }
    .board-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; }
    .empty-state { padding: 44px 22px; color: var(--muted); text-align: center; background: rgba(255,255,255,.58); border: 1px dashed #c9c8be; border-radius: var(--radius); }
    .empty-state .empty-icon { margin-bottom: 8px; color: var(--accent); font-family: Georgia, serif; font-size: 38px; }

    .workspace-shell { overflow: hidden; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); }
    .workspace-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 16px 20px; background: #fffdf8; border-bottom: 1px solid var(--line); }
    .workspace-head h2 { margin: 0; font-size: 21px; }
    .workspace-head p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .workspace-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .pdf-workspace { display: grid; grid-template-columns: minmax(0, 1fr) 320px; min-height: 680px; }
    .pdf-main { min-width: 0; background: #d9d7d0; }
    .pdf-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 10px 14px; color: var(--teal-dark); background: #efede6; border-bottom: 1px solid #d4d2ca; }
    .toolbar-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .toolbar-label { color: var(--muted); font-size: 12px; }
    .toolbar-button { min-width: 40px; min-height: 40px; padding: 7px 11px; color: var(--teal-dark); background: rgba(255,255,255,.62); border: 1px solid #d5d5cb; border-radius: 10px; }
    .toolbar-button:hover { background: #fff; border-color: #aac6ba; }
    .toolbar-button.active { color: #fffaf4; background: var(--accent); border-color: var(--accent); }
    .pdf-scroll { min-height: 620px; overflow: auto; padding: 34px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-x pan-y; }
    .page-stage { position: relative; width: max-content; min-width: 340px; min-height: 440px; margin: 0 auto; background: #fff; box-shadow: 0 18px 38px rgba(38, 45, 41, .18); }
    .page-stage canvas { display: block; }
    .zone-layer { position: absolute; inset: 0; pointer-events: none; touch-action: auto; z-index: 4; }
    .zone-layer .zone { pointer-events: auto; }
    .zone-layer.is-placing { pointer-events: auto; cursor: crosshair; touch-action: none; }
    .zone-layer.ink-mode { pointer-events: none; }
    .zone { position: absolute; z-index: 2; display: grid; place-items: center; width: 32px; height: 32px; min-width: 32px; max-width: 32px; padding: 0; overflow: visible; color: #fffaf4; background: var(--accent); border: 2px solid #fff8ee; border-radius: 50% 50% 50% 0; text-align: center; box-shadow: 0 5px 14px rgba(49,95,89,.25); transform: translate(-50%, -50%) rotate(-45deg); }
    .zone::before, .zone::after { content: none; }
    .zone:hover, .zone.selected { background: var(--teal); border-color: #fff; transform: translate(-50%, -50%) rotate(-45deg) scale(1.08); }
    .zone-label { display: block; color: #fffaf4; font-size: 12px; font-weight: 800; line-height: 1; transform: rotate(45deg); }
    .zone-response-count { position: absolute; top: -13px; left: 22px; min-width: 22px; height: 18px; padding: 0 5px; color: var(--teal-dark); background: #fffdf8; border: 1px solid #d7e4dc; border-radius: 999px; box-shadow: 0 3px 9px rgba(49,95,89,.2); font-size: 10px; font-weight: 800; line-height: 16px; transform: rotate(45deg); }
    .zone-status { display: none; }
    body.editor-mode .zone { cursor: grab; touch-action: none; }
    body.editor-mode .zone:active { cursor: grabbing; }
    .ink-layer { position: absolute; inset: 0; z-index: 3; display: none; width: 100%; height: 100%; touch-action: pan-x pan-y; user-select: none; -webkit-user-select: none; }
    .page-stage .ink-layer.visible { display: block; }
    .page-stage .ink-layer.is-drawing { display: block; cursor: crosshair; touch-action: none; }
    .ink-controls { display: inline-flex; align-items: center; flex-wrap: nowrap; gap: 4px; min-width: max-content; }
    .ink-icon-button, .ink-swatch { display: inline-grid; flex: 0 0 auto; place-items: center; width: 36px; height: 36px; padding: 0; color: var(--teal-dark); background: rgba(255,255,255,.72); border: 1px solid #d5d5cb; border-radius: 9px; font-size: 18px; }
    .ink-icon-button:hover, .ink-icon-button.active { color: #fffaf4; background: var(--teal); border-color: var(--teal); }
    .ink-icon-button.danger:hover { color: #fffaf4; background: var(--danger); border-color: var(--danger); }
    .ink-swatch { width: 25px; height: 25px; border: 2px solid rgba(255,255,255,.9); border-radius: 50%; box-shadow: 0 0 0 1px #cfd0c8; }
    .ink-swatch.active { box-shadow: 0 0 0 2px var(--teal); }
    .ink-custom-color { width: 30px; height: 30px; padding: 2px; border: 1px solid #d5d5cb; border-radius: 8px; }
    .ink-width-selector, .review-width-selector { display: inline-flex; align-items: center; gap: 2px; padding: 2px; background: rgba(255,255,255,.6); border: 1px solid #d5d5cb; border-radius: 9px; }
    .ink-width-btn, .review-width-btn { display: inline-grid; place-items: center; width: 28px; height: 28px; padding: 0; color: var(--teal-dark); background: transparent; border: 1px solid transparent; border-radius: 7px; font-size: 13px; font-weight: 700; cursor: pointer; transition: all .15s ease; }
    .ink-width-btn:hover, .review-width-btn:hover { background: rgba(255,255,255,.9); }
    .ink-width-btn.active, .review-width-btn.active { color: #fffaf4; background: var(--teal); border-color: var(--teal); }
    .ink-shape-buttons { display: inline-flex; align-items: center; gap: 3px; padding-left: 3px; border-left: 1px solid #d5d5cb; }
    .ink-shape-buttons[hidden] { display: none; }
    .ink-status { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .empty-pdf { display: grid; place-items: center; min-width: 340px; min-height: 520px; padding: 30px; color: var(--muted); background: #fffdf8; border: 1px dashed #c6c7be; text-align: center; }
    .empty-pdf strong { display: block; margin-bottom: 5px; color: var(--teal-dark); font-size: 18px; }
    .workspace-sidebar { overflow: auto; max-height: 740px; padding: 20px; background: #fffdf8; border-left: 1px solid var(--line); }
    .sidebar-section { margin-bottom: 23px; }
    .sidebar-section:last-child { margin-bottom: 0; }
    .sidebar-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; color: var(--teal-dark); font-size: 13px; font-weight: 800; letter-spacing: .04em; }
    .field { margin-bottom: 12px; }
    .field label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .field input, .field textarea, .field select, .modal-card input, .modal-card textarea, .modal-card select {
      width: 100%;
      padding: 10px 12px;
      color: var(--ink);
      background: #fff;
      border: 1px solid #d8d8cf;
      border-radius: 10px;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .field input:focus, .field textarea:focus, .field select:focus, .modal-card input:focus, .modal-card textarea:focus, .modal-card select:focus { border-color: #85aa9c; box-shadow: 0 0 0 3px rgba(133,170,156,.16); }
    .field textarea, .modal-card textarea { min-height: 88px; resize: vertical; }
    .helper { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
    .area-list { display: grid; gap: 8px; }
    .area-item { display: flex; align-items: center; gap: 8px; padding: 10px; background: #f7f5ef; border: 1px solid transparent; border-radius: 11px; cursor: pointer; }
    .area-item:hover, .area-item.selected { background: var(--teal-soft); border-color: #bfd7ce; }
    .area-number { display: grid; flex: 0 0 auto; place-items: center; width: 24px; height: 24px; color: #fff; background: var(--teal); border-radius: 8px; font-size: 11px; font-weight: 800; }
    .area-item-copy { min-width: 0; flex: 1; }
    .area-item-copy strong { display: block; overflow: hidden; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
    .area-item-copy small { color: var(--muted); font-size: 11px; }
    .area-item-actions { display: inline-flex; flex: 0 0 auto; align-items: center; gap: 3px; }
    .area-action-button { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: 7px; font-size: 15px; }
    .area-action-button:hover { color: var(--teal-dark); background: #fff; border-color: #bfd7ce; }
    .area-action-button.danger:hover { color: var(--danger); background: #fff2ee; border-color: #ecc7be; }
    .area-form-delete { margin-top: 6px; }
    .area-empty { padding: 12px; color: var(--muted); background: #f7f5ef; border-radius: 11px; font-size: 12px; }

    .student-shell { display: grid; gap: 16px; }
    .student-banner { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding: 24px 26px; background: linear-gradient(135deg, #315f59, #477c6f); border-radius: 22px; color: #f7fff9; box-shadow: var(--shadow); }
    .student-banner h1 { margin-bottom: 4px; color: #fffdf5; font-size: clamp(26px, 4vw, 42px); }
    .student-banner .eyebrow { color: #f6c6a5; }
    .student-banner p { max-width: 650px; margin-bottom: 0; color: #d9ebe2; }
    .student-identity { min-width: 230px; padding: 14px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); border-radius: 15px; }
    .student-identity label { display: block; margin-bottom: 5px; color: #d9ebe2; font-size: 12px; }
    .student-identity input { width: 100%; padding: 9px 11px; color: #fff; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.35); border-radius: 9px; outline: none; }
    .student-identity input::placeholder { color: #c5ddd3; }
    .student-identity input:focus { border-color: #fff; }
    .student-workspace { min-height: 680px; }
    .student-workspace .workspace-sidebar { display: flex; flex-direction: column; height: 100%; min-height: 0; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .answer-panel { display: flex; flex: 1 0 auto; flex-direction: column; min-height: 0; }
    .answer-panel-empty { display: grid; flex: 1; place-items: center; min-height: 220px; padding: 22px; color: var(--muted); background: #f7f5ef; border-radius: 15px; text-align: center; }
    .answer-panel-empty strong { display: block; margin-bottom: 6px; color: var(--teal-dark); font-size: 18px; }
    .answer-panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 15px; }
    .answer-panel-head h3 { margin-bottom: 3px; }
    .answer-panel-head p { margin-bottom: 0; color: var(--muted); font-size: 12px; }
    .close-mini { display: grid; place-items: center; width: 36px; height: 36px; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 10px; }
    .close-mini:hover { color: var(--danger); border-color: #e2bbb4; }
    .photo-drop { padding: 15px; background: #f8f6f0; border: 1px dashed #c9c9be; border-radius: 13px; }
    .photo-drop p { margin-bottom: 10px; color: var(--muted); font-size: 12px; }
    .photo-preview-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin-top: 9px; }
    .photo-thumb { position: relative; aspect-ratio: 4 / 3; max-height: 140px; overflow: hidden; background: #e9e7df; border: 1px solid #d8d6cc; border-radius: 10px; }

  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal-card" id="modalCard">
      <button class="modal-close" id="modalCloseButton" type="button" aria-label="關閉">×</button>
      <h2 id="modalTitle"></h2>
      <div class="modal-message" id="modalMessage"></div>

      <div class="modal-actions" id="modalActions"></div>

  <div class="toast-stack" id="toastStack"></div>

  <script>
    // ============================================================
    // GAS URL 優先序：原始碼預設值 > 網址參數 > LocalStorage > 設定視窗
    // GAS Web App 網址直接寫在 DEFAULT_GAS_URL，分享網址不再需要額外設定。
    // ============================================================
    const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbz4n8969la0hbjNCno3HM5dR0mvMbL8rvbom08wrquC8Ah8QhGjoMUAdcxF9uJl_5Kt7w/exec";
    const APP_KEY = "pdfw_";
    const DB_NAME = "pdfw_local_v1";
    const MAX_IMAGE_COUNT = 2;
    const MAX_PDF_BYTES = 20 * 1024 * 1024;
    const MAX_IMAGE_BYTES = 2 * 1024 * 1024;
    const INK_WIDTH_STEPS = [2, 4, 6, 8];
    const GAS_URL = resolveGasUrl();

    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }

    const state = {
      demo: localStorage.getItem(APP_KEY + "demo") === "1",
      view: "manager",
      boardId: "",
      board: null,
      boards: [],
      areas: [],
      pdf: null,
      pdfBytes: null,
      currentPage: 1,
      zoom: 1,
      renderToken: 0,
      drawingZone: false,
      selectedAreaId: "",
      pendingPdf: null,
      activeAreaId: "",
      nickname: localStorage.getItem(APP_KEY + "nickname") || "",
      studentSubmissions: new Map(),
      pendingStudentImages: [],
      activeStudentImages: [],
      activeDraftKey: "",
      teacherInk: new Map(),
      teacherInkVersion: "",
      drawingInk: false,
      inkTool: "pen",
      previousInkTool: "pen",
      inkShape: "arrow",
      inkColor: "#c47f78",
      inkWidth: 2,
      inkSaveTimer: null,
      classroomStateTimer: null,
      submissions: [],
      reviewLoading: false,
      reviewSubmission: null,
      reviewImages: [],
      reviewPhotoIndex: 0,
      reviewStrokes: [],
      reviewComment: "",
      reviewColor: "#d34f42",
      reviewWidth: 2,
      reviewTool: "pen",
      previousReviewTool: "pen",
      reviewShape: "arrow",
      reviewZoom: 1,
      adminToken: localStorage.getItem(APP_KEY + "admin_token") || "",
      pollTimer: null,
      outboxRetryTimer: null,
      flushBusy: false,
      imageCache: new Map(),
      clientId: getOrCreateClientId()
    };

    let modalResolver = null;
    let modalCloseResolver = null;
    let dbPromise = null;
    let pdfRenderQueue = Promise.resolve();

    function resolveGasUrl() {
      if (DEFAULT_GAS_URL && DEFAULT_GAS_URL.trim()) return DEFAULT_GAS_URL.trim();
      const params = new URLSearchParams(window.location.search);
      const config = params.get("config");
      if (config) {
        try {
          const decoded = atob(config);
          localStorage.setItem(APP_KEY + "gas_url", decoded);
          return decoded;
        } catch (error) {
          // 忽略無法解碼的分享參數，稍後改用其他來源。
        }
      }
      return localStorage.getItem(APP_KEY + "gas_url") || "";
    }

    function getOrCreateClientId() {
      const key = APP_KEY + "client_id";
      const existing = localStorage.getItem(key);
      if (existing) return existing;
      const value = "C-" + (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(16).slice(2));
      localStorage.setItem(key, value);
      return value;
    }

    function createId(prefix) {
      return prefix + "-" + (window.crypto && crypto.randomUUID ? crypto.randomUUID().replace(/-/g, "").slice(0, 14) : Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
    }

    function escapeHtml(value) {
      return String(value == null ? "" : value).replace(/[&<>'"]/g, function (char) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[char];
      });
    }

    function formatTime(value) {
      if (!value) return "尚無紀錄";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleString("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function hashString(value) {
      let hash = 2166136261;
      for (let index = 0; index < String(value).length; index += 1) {
        hash ^= String(value).charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }
      return (hash >>> 0).toString(36);
    }

    function submissionIdFor(boardId, areaId, nickname) {
      return "S-" + hashString(boardId + "|" + areaId + "|" + nickname);
    }

    function showToast(message, type) {
      const toast = document.createElement("div");
      toast.className = "toast" + (type ? " " + type : "");
      toast.textContent = message;
      document.getElementById("toastStack").appendChild(toast);
      window.setTimeout(function () { toast.remove(); }, 3600);
    }

    function closeModal(value) {
      const overlay = document.getElementById("modalOverlay");
      const resolver = modalResolver;
      const closeResolver = modalCloseResolver;
      modalResolver = null;
      modalCloseResolver = null;
      overlay.classList.remove("show");
      overlay.setAttribute("aria-hidden", "true");
      document.getElementById("modalCard").classList.remove("wide");
      document.getElementById("modalContent").innerHTML = "";
      document.getElementById("modalActions").innerHTML = "";
      if (resolver) resolver(value);
      if (closeResolver) closeResolver(value);
    }

    // 所有提示、錯誤與確認均由此自訂 Modal 處理。
    function showModal(title, message, type = "info") {
      const overlay = document.getElementById("modalOverlay");
      modalCloseResolver = null;
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalMessage").textContent = message || "";
      document.getElementById("modalContent").innerHTML = "";
      const actions = document.getElementById("modalActions");
      actions.innerHTML = "";
      const okButton = document.createElement("button");
      okButton.className = "button primary";
      okButton.type = "button";
      okButton.textContent = "確定";
      okButton.addEventListener("click", function () { closeModal(true); });
      if (type === "confirm") {
        const cancelButton = document.createElement("button");
        cancelButton.className = "button subtle";
        cancelButton.type = "button";
        cancelButton.textContent = "取消";
        cancelButton.addEventListener("click", function () { closeModal(false); });
        actions.appendChild(cancelButton);
      }
      actions.appendChild(okButton);
      overlay.classList.add("show");
      overlay.setAttribute("aria-hidden", "false");
      if (type === "confirm") return new Promise(function (resolve) { modalResolver = resolve; });
      return Promise.resolve(true);
    }

    function openFormModal(title, html, submitLabel, onSubmit, options) {
      const overlay = document.getElementById("modalOverlay");
      const card = document.getElementById("modalCard");
      return new Promise(function (resolve) {
        let settled = false;
        const settle = function (value) {
          if (settled) return;
          settled = true;
          resolve(value);
        };
        modalCloseResolver = settle;
        card.classList.toggle("wide", Boolean(options && options.wide));
        document.getElementById("modalTitle").textContent = title;
        document.getElementById("modalMessage").textContent = "";
        document.getElementById("modalContent").innerHTML = html;
        const actions = document.getElementById("modalActions");
        actions.innerHTML = "";
        const cancelButton = document.createElement("button");
        cancelButton.className = "button subtle";
        cancelButton.type = "button";
        cancelButton.textContent = "取消";
        cancelButton.addEventListener("click", function () { closeModal(false); });
        const submitButton = document.createElement("button");
        submitButton.className = "button primary";
        submitButton.type = "submit";
        submitButton.textContent = submitLabel || "儲存";
        actions.appendChild(cancelButton);
        actions.appendChild(submitButton);
        overlay.classList.add("show");
        overlay.setAttribute("aria-hidden", "false");
        const form = document.getElementById("modalContent").querySelector("form");
        if (!form) {
          settle(false);
          return;
        }
        if (!form.id) form.id = "modalForm";
        submitButton.setAttribute("form", form.id);
        form.addEventListener("submit", async function (event) {
          event.preventDefault();
          submitButton.disabled = true;
          try {
            const result = await onSubmit(new FormData(form), form);
            if (result !== false) {
              const value = result === undefined ? true : result;
              closeModal(value);
            } else {
              submitButton.disabled = false;
            }
          } catch (error) {
            submitButton.disabled = false;
            closeModal(false);
            await showModal("操作未完成", error.message || "請稍後再試。", "error");
          }
        });
        const firstInput = form.querySelector("input, textarea, select");
        if (firstInput) window.setTimeout(function () { firstInput.focus(); }, 50);
      });
    }

    function setConnectionBadge() {
      const badge = document.getElementById("connectionBadge");
      badge.classList.remove("is-online", "is-demo");
      if (state.demo) {
        badge.textContent = "本機示範模式";
        badge.classList.add("is-demo");
      } else if (GAS_URL) {
        badge.textContent = "GAS 已設定";
        badge.classList.add("is-online");
      } else {
        badge.textContent = "尚未設定 GAS";
      }
    }

    function setOfflineNote(show) {
      const note = document.querySelector(".offline-note");
      if (note) note.classList.toggle("show", Boolean(show));
    }

    function openSettingsModal() {
      const modal = document.getElementById("settingsModal");
      document.getElementById("gasUrlInput").value = localStorage.getItem(APP_KEY + "gas_url") || "";
      const shareBlock = document.getElementById("shareSettingsBlock");
      shareBlock.style.display = state.board ? "block" : "none";
      modal.classList.add("show");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeSettingsModal() {
      const modal = document.getElementById("settingsModal");
      modal.classList.remove("show");
      modal.setAttribute("aria-hidden", "true");
    }

    async function copyText(value) {
      try {
        await navigator.clipboard.writeText(value);
        showToast("已複製分享網址。", "success");
      } catch (error) {
        const textarea = document.createElement("textarea");
        textarea.value = value;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
        showToast("已複製分享網址。", "success");
      }
    }

    function makeBoardUrl(boardId) {
      const url = new URL(window.location.href);
      url.search = "";
      url.searchParams.set("view", "student");
      url.searchParams.set("board", boardId);
      if (GAS_URL) url.searchParams.set("config", btoa(GAS_URL));
      return url.toString();
    }

    function openShareModal(board) {
      const link = makeBoardUrl(board.id);
      const localOnly = state.demo || !GAS_URL;
      openFormModal("學生連線 QR Code", "<form><p class=\"modal-tip\" style=\"text-align:center;margin-top:0;\">" + (localOnly ? "目前為本機示範模式，請用目前裝置測試。" : "請學生以手機或平板掃描 QR Code 進入作答區。") + "</p><div class=\"qr-wrap\"><img src=\"https://quickchart.io/qr?text=" + encodeURIComponent(link) + "&size=360\" alt=\"學生作答 QR Code\"></div></form>", "複製作答網址", async function () {
        await copyText(link);
        return true;
      });
    }

    function bindStaticEvents() {
      document.getElementById("brandHome").addEventListener("click", function (event) {
        event.preventDefault();
        goView("manager");
      });
      document.getElementById("settingsButton").addEventListener("click", openSettingsModal);
      document.querySelector("[data-close-settings]").addEventListener("click", closeSettingsModal);
      document.getElementById("settingsModal").addEventListener("click", function (event) {
        if (event.target.id === "settingsModal") closeSettingsModal();
      });
      document.getElementById("modalCloseButton").addEventListener("click", function () { closeModal(false); });
      document.getElementById("modalOverlay").addEventListener("click", function (event) {
        if (event.target.id === "modalOverlay") closeModal(false);
      });
      document.getElementById("saveSettingsButton").addEventListener("click", function () {
        const value = document.getElementById("gasUrlInput").value.trim();
        if (!/^https:\/\//i.test(value)) {
          showModal("網址格式不正確", "請貼上以 https 開頭的 GAS Web App 網址。", "error");
          return;
        }
        localStorage.setItem(APP_KEY + "gas_url", value);
        localStorage.removeItem(APP_KEY + "demo");
        closeSettingsModal();
        showToast("連線設定已儲存，正在重新整理。", "success");
        window.setTimeout(function () { window.location.reload(); }, 500);
      });
      document.getElementById("clearSettingsButton").addEventListener("click", async function () {
        const ok = await showModal("清除連線設定", "將移除 GAS 網址與本機示範標記，確定要重置嗎？", "confirm");
        if (!ok) return;
        localStorage.removeItem(APP_KEY + "gas_url");
        localStorage.removeItem(APP_KEY + "demo");
        window.location.reload();
      });
      document.getElementById("useDemoButton").addEventListener("click", function () {
        localStorage.setItem(APP_KEY + "demo", "1");
        closeSettingsModal();
        window.location.reload();
      });
      document.getElementById("generateShareButton").addEventListener("click", function () {
        if (!state.board) return;
        const link = makeBoardUrl(state.board.id);
        document.getElementById("shareUrlOutput").textContent = link;
        document.getElementById("shareUrlOutput").style.display = "block";
        document.getElementById("shareQrImage").src = "https://quickchart.io/qr?text=" + encodeURIComponent(link) + "&size=220";
        document.getElementById("shareQrWrap").style.display = "grid";
      });
      document.getElementById("__sheetLink").addEventListener("click", function () {
        gasGet("sheetUrl").then(function (result) {
          if (result && result.url) window.open(result.url, "_blank", "noopener");
        });
      });
      window.addEventListener("online", function () {
        setOfflineNote(false);
        if (state.outboxRetryTimer) { window.clearTimeout(state.outboxRetryTimer); state.outboxRetryTimer = null; }
        flushOutbox();
        showToast("網路已恢復，正在補傳暫存資料。", "success");
      });
      window.addEventListener("offline", function () {
        setOfflineNote(true);
        showToast("目前離線，資料會先保留在本機。", "warning");
      });
      window.addEventListener("popstate", renderRoute);
      document.addEventListener("selectstart", function (event) {
        if (!event.target.closest("input, textarea, [contenteditable='true']")) {
          event.preventDefault();
        }
      });
      document.addEventListener("contextmenu", function (event) {
        if (event.target.closest("canvas, .page-stage, .review-image-stage, .pdf-scroll, .zone-layer, .review-image-wrap")) {
          event.preventDefault();
        }
      });
      document.addEventListener("dragstart", function (event) {
        if (!event.target.closest("input, textarea")) {
          event.preventDefault();
        }
      });
      document.addEventListener("gesturestart", function (event) { event.preventDefault(); });
      document.addEventListener("gesturechange", function (event) { event.preventDefault(); });
      document.addEventListener("gestureend", function (event) { event.preventDefault(); });
      window.addEventListener("applepencildoubletap", function (event) {
        event.preventDefault();
        togglePencilEraser();
      });
      document.addEventListener("applepencildoubletap", function (event) {
        event.preventDefault();
        togglePencilEraser();
      });
      window.addEventListener("keydown", function (event) {
        if (event.target && event.target.matches("input, textarea, select")) return;
        if (event.key === "e" || event.key === "E") {
          event.preventDefault();
          togglePencilEraser();
          return;
        }
        const overlay = document.getElementById("modalOverlay");
        if (overlay && overlay.classList.contains("show") && state.activeAreaId && state.reviewSubmission) {
          if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
            event.preventDefault();
            moveReviewSubmission(-1);
          } else if (event.key === "ArrowRight" || event.key === "ArrowDown") {
            event.preventDefault();
            moveReviewSubmission(1);
          }
        }
      });
      bindPullToRefresh();
    }

    async function refreshCurrentView() {
      try {
        if (state.view === "manager") {
          const result = await managerApi("listBoards", {});
          for (const board of result.data || []) await cacheBoardLocally(board);
          await pruneStaleLocalBoards(result.data || []);
          renderBoardCards();
        } else if (state.view === "student" && state.boardId) {
          await loadBoardContext(state.boardId);
          await loadStudentSubmissions();
          await loadClassroomSync();
          renderStudentAreaList();
          renderZones();
        } else if (state.view === "review" && state.boardId) {
          await loadBoardContext(state.boardId);
          await loadClassroomSync();
          await loadClassroomSubmissions();
          renderClassroomSidebar();
          renderZones();
          renderTeacherInk();
        } else if (state.view === "editor" && state.boardId) {
          await loadBoardContext(state.boardId);
          renderEditorAreaList();
          renderZones();
          renderTeacherInk();
        }
        showToast("已更新至最新資料。", "success");
      } catch (error) {
        showToast("重新整理失敗：" + (error.message || "網路連線異常。"), "error");
      }
    }

    function bindPullToRefresh() {
      let startY = 0;
      let isPulling = false;
      let isRefreshing = false;
      const threshold = 70;
      const indicator = document.getElementById("pullRefreshIndicator");
      if (!indicator) return;
      const icon = indicator.querySelector(".pull-icon");
      const text = indicator.querySelector(".pull-text");

      window.addEventListener("touchstart", function (event) {
        if (isRefreshing || state.drawingInk || event.touches.length !== 1) return;
        if (state.view !== "manager") return;
        const scrollY = window.scrollY || document.documentElement.scrollTop || 0;
        const target = event.target;
        if (target && target.closest && target.closest(".modal-card, .review-panel, textarea, input, select, .pdf-scroll, .classroom-pdf-panel, .student-workspace")) return;
        if (scrollY <= 5) {
          startY = event.touches[0].clientY;
          isPulling = true;
        }
      }, { passive: true });

      window.addEventListener("touchmove", function (event) {
        if (!isPulling || isRefreshing || event.touches.length !== 1) return;
        const currentY = event.touches[0].clientY;
        const diff = currentY - startY;
        if (diff > 10) {
          const distance = Math.min(95, diff * 0.45);
          indicator.style.top = (distance - 42) + "px";
          indicator.classList.add("visible");
          if (distance >= threshold * 0.45) {
            if (icon) icon.textContent = "↑";
            if (text) text.textContent = "釋放立即重新整理";
          } else {
            if (icon) icon.textContent = "↓";
            if (text) text.textContent = "下拉重新整理";
          }
        } else {
          indicator.classList.remove("visible");
        }
      }, { passive: true });

      window.addEventListener("touchend", async function (event) {
        if (!isPulling || isRefreshing) { isPulling = false; return; }
        isPulling = false;
        const touch = event.changedTouches[0];
        if (!touch) return;
        const diff = touch.clientY - startY;
        if (diff * 0.45 >= threshold * 0.45) {
          isRefreshing = true;
          indicator.style.top = "18px";
          indicator.classList.add("visible", "refreshing");
          if (icon) icon.textContent = "↻";
          if (text) text.textContent = "正在重新整理……";
          await refreshCurrentView();
          indicator.classList.remove("refreshing");
          indicator.style.top = "-60px";
          indicator.classList.remove("visible");
          isRefreshing = false;
        } else {
          indicator.style.top = "-60px";
          indicator.classList.remove("visible");
        }
      }, { passive: true });

      window.addEventListener("touchcancel", function () {
        isPulling = false;
        if (!isRefreshing) {
          indicator.style.top = "-60px";
          indicator.classList.remove("visible");
        }
      }, { passive: true });
    }

    async function refreshSheetLink() {
      if (!GAS_URL || state.demo) return;
      try {
        const result = await gasGet("sheetUrl");
        if (result && result.ok && result.url) document.getElementById("__sheetLink").style.display = "inline-flex";
      } catch (error) {
        // 試算表捷徑不是主要功能，連線失敗時保持隱藏。
      }
    }

    function openLocalDb() {
      if (!window.indexedDB) return Promise.resolve(null);
      if (dbPromise) return dbPromise;
      dbPromise = new Promise(function (resolve, reject) {
        const request = indexedDB.open(DB_NAME, 3);
        request.onupgradeneeded = function () {
          const db = request.result;
          ["boards", "files", "ink", "classroomState", "submissions", "drafts", "outbox"].forEach(function (store) {
            if (!db.objectStoreNames.contains(store)) db.createObjectStore(store, { keyPath: "id" });
          });
        };
        request.onsuccess = function () { resolve(request.result); };
        request.onerror = function () { resolve(null); };
      });
      return dbPromise;
    }

    const memoryStore = { boards: new Map(), files: new Map(), ink: new Map(), classroomState: new Map(), submissions: new Map(), drafts: new Map(), outbox: new Map() };

    async function localPut(store, value) {
      const db = await openLocalDb();
      if (!db) { memoryStore[store].set(value.id, value); return value; }
      return new Promise(function (resolve) {
        const transaction = db.transaction(store, "readwrite");
        transaction.objectStore(store).put(value);
        transaction.oncomplete = function () { resolve(value); };
        transaction.onerror = function () { memoryStore[store].set(value.id, value); resolve(value); };
      });
    }

    async function localGet(store, id) {
      const db = await openLocalDb();
      if (!db) return memoryStore[store].get(id) || null;
      return new Promise(function (resolve) {
        const request = db.transaction(store, "readonly").objectStore(store).get(id);
        request.onsuccess = function () { resolve(request.result || memoryStore[store].get(id) || null); };
        request.onerror = function () { resolve(memoryStore[store].get(id) || null); };
      });
    }

    async function localAll(store) {
      const db = await openLocalDb();
      if (!db) return Array.from(memoryStore[store].values());
      return new Promise(function (resolve) {
        const request = db.transaction(store, "readonly").objectStore(store).getAll();
        request.onsuccess = function () {
          const values = request.result || [];
          const known = new Set(values.map(function (item) { return item.id; }));
          Array.from(memoryStore[store].values()).forEach(function (item) { if (!known.has(item.id)) values.push(item); });
          resolve(values);
        };
        request.onerror = function () { resolve(Array.from(memoryStore[store].values())); };
      });
    }

    async function localDelete(store, id) {
      memoryStore[store].delete(id);
      const db = await openLocalDb();
      if (!db) return;
      return new Promise(function (resolve) {
        const transaction = db.transaction(store, "readwrite");
        transaction.objectStore(store).delete(id);
        transaction.oncomplete = function () { resolve(); };
        transaction.onerror = function () { resolve(); };
      });
    }

    async function removeLocalSubmissionsForRemovedAreas(boardId, areas) {
      const retainedAreas = {};
      (areas || []).forEach(function (area) { if (area && area.id) retainedAreas[String(area.id)] = true; });
      const submissions = (await localAll("submissions")).filter(function (item) { return String(item.boardId) === String(boardId) && !retainedAreas[String(item.areaId)]; });
      if (!submissions.length) return;
      const targetSubmissions = {};
      const targetFiles = {};
      submissions.forEach(function (submission) {
        targetSubmissions[String(submission.id)] = true;
        (Array.isArray(submission.imageFileIds) ? submission.imageFileIds : []).forEach(function (fileId) { if (fileId) targetFiles[String(fileId)] = true; });
      });
      (await localAll("files")).forEach(function (file) {
        if (targetSubmissions[String(file.submissionId)] || targetFiles[String(file.id)]) targetFiles[String(file.id)] = true;
      });
      for (const fileId of Object.keys(targetFiles)) await localDelete("files", fileId);
      for (const submission of submissions) await localDelete("submissions", submission.id);
    }

    async function removeLocalBoardData(boardId) {
      const key = String(boardId || "");
      const board = await localGet("boards", boardId);
      const submissions = (await localAll("submissions")).filter(function (item) { return String(item.boardId) === key; });
      const submissionIds = new Set(submissions.map(function (item) { return String(item.id); }));
      const files = (await localAll("files")).filter(function (item) {
        return String(item.boardId) === key || submissionIds.has(String(item.submissionId)) || (board && String(item.id) === String(board.pdfFileId));
      });
      const outbox = (await localAll("outbox")).filter(function (item) {
        const payload = item.payload || {};
        return String(payload.boardId || payload.clientBoardId || "") === key;
      });
      const inkRows = (await localAll("ink")).filter(function (item) { return String(item.boardId) === key; });
      const classroomRows = (await localAll("classroomState")).filter(function (item) { return String(item.boardId) === key; });
      const draftRows = (await localAll("drafts")).filter(function (item) { return String(item.boardId) === key; });
      for (const file of files) {
        state.imageCache.delete(file.id);
        await localDelete("files", file.id);
      }
      for (const submission of submissions) await localDelete("submissions", submission.id);
      for (const item of inkRows) await localDelete("ink", item.id);
      for (const item of classroomRows) await localDelete("classroomState", item.id);
      for (const item of draftRows) await localDelete("drafts", item.id);
      for (const item of outbox) await localDelete("outbox", item.id);
      await localDelete("boards", boardId);
      return { boards: board ? 1 : 0, files: files.length, submissions: submissions.length, ink: inkRows.length, classroomState: classroomRows.length, drafts: draftRows.length, outbox: outbox.length };
    }

    function dataUrlParts(dataUrl) {
      const value = String(dataUrl || "");
      const comma = value.indexOf(",");
      return { mime: comma > -1 ? (value.slice(5, value.indexOf(";")) || "application/octet-stream") : "application/octet-stream", base64: comma > -1 ? value.slice(comma + 1) : value };
    }

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
      return bytes;
    }

    function base64ToDataUrl(value, mime) {
      return "data:" + (mime || "application/octet-stream") + ";base64," + value;
    }

    function arrayBufferToDataUrl(buffer, mime) {
      const bytes = new Uint8Array(buffer);
      let binary = "";
      const chunk = 8192;
      for (let index = 0; index < bytes.length; index += chunk) binary += String.fromCharCode.apply(null, bytes.subarray(index, index + chunk));
      return "data:" + (mime || "application/octet-stream") + ";base64," + btoa(binary);
    }

    function fileToDataUrl(file) {
      return new Promise(function (resolve, reject) {
        const reader = new FileReader();
        reader.onload = function () { resolve(reader.result); };
        reader.onerror = function () { reject(new Error("檔案讀取失敗。")); };
        reader.readAsDataURL(file);
      });
    }

    function loadImage(dataUrl) {
      return new Promise(function (resolve, reject) {
        const image = new Image();
        image.onload = function () { resolve(image); };
        image.onerror = function () { reject(new Error("圖片讀取失敗。")); };
        image.src = dataUrl;
      });
    }

    async function compressImage(file) {
      const source = await fileToDataUrl(file);
      const image = await loadImage(source);
      const ratio = Math.min(1, 800 / Math.max(image.naturalWidth || image.width, 1));
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round((image.naturalWidth || image.width) * ratio));
      canvas.height = Math.max(1, Math.round((image.naturalHeight || image.height) * ratio));
      const context = canvas.getContext("2d");
      context.fillStyle = "#ffffff";
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.drawImage(image, 0, 0, canvas.width, canvas.height);
      let dataUrl = canvas.toDataURL("image/jpeg", .78);
      if (dataUrl.length * .75 > MAX_IMAGE_BYTES) dataUrl = canvas.toDataURL("image/jpeg", .58);
      if (dataUrl.length * .75 > MAX_IMAGE_BYTES) dataUrl = canvas.toDataURL("image/jpeg", .42);
      if (dataUrl.length * .75 > MAX_IMAGE_BYTES) throw new Error("照片壓縮後仍超過 2 MB，請改拍清楚且範圍較小的照片。");
      return { name: file.name.replace(/\.[^.]+$/, "") + ".jpg", mime: "image/jpeg", data: dataUrl };
    }

    async function localSaveFile(filePayload, purpose, boardId, submissionId) {
      const id = "L-" + createId("F");
      await localPut("files", { id: id, name: filePayload.name || "檔案", mime: filePayload.mime || "application/octet-stream", dataUrl: filePayload.data, purpose: purpose, boardId: boardId || "", submissionId: submissionId || "", createdAt: new Date().toISOString() });
      return id;
    }

    function localInkVersion(items) {
      return (items || []).map(function (item) { return String(item.id || "") + ":" + String(item.updatedAt || ""); }).sort().join("|");
    }

    async function localRequest(action, payload) {
      const data = payload || {};
      if (action === "settings") return { ok: true, settings: { adminConfigured: false, maxImageBytes: MAX_IMAGE_BYTES, maxPdfBytes: MAX_PDF_BYTES } };
      if (action === "verifyAdmin") return { ok: true, token: "local-admin", configured: false };
      if (action === "sheetUrl") return { ok: true, url: "" };
      if (action === "listInk") {
        const inkRows = (await localAll("ink")).filter(function (item) { return String(item.boardId) === String(data.boardId); });
        return { ok: true, data: inkRows, inkVersion: localInkVersion(inkRows) };
      }
      if (action === "saveInk") {
        const board = await localGet("boards", data.boardId);
        if (!board) throw new Error("找不到指定教材版面。");
        const annotation = { id: data.id || "INK-" + board.id + "-" + (Number(data.page) || 1), boardId: board.id, page: Math.max(1, Number(data.page) || 1), strokes: Array.isArray(data.strokes) ? data.strokes : [], updatedAt: new Date().toISOString() };
        await localPut("ink", annotation);
        return { ok: true, annotation: annotation };
      }
      if (action === "classroomSync") {
        const board = await localGet("boards", data.boardId);
        if (!board) throw new Error("找不到指定教材版面。");
        const classroomState = await localGet("classroomState", "STATE-" + board.id);
        const inkRows = (await localAll("ink")).filter(function (item) { return String(item.boardId) === String(board.id); });
        const inkVersion = localInkVersion(inkRows);
        const inkChanged = String(data.inkVersion || "") !== inkVersion;
        return { ok: true, state: classroomState || { id: "STATE-" + board.id, boardId: board.id, page: 1, zoom: 1, updatedAt: "" }, inkVersion: inkVersion, inkChanged: inkChanged, ink: inkChanged ? inkRows : null };
      }
      if (action === "saveClassroomState") {
        const board = await localGet("boards", data.boardId);
        if (!board) throw new Error("找不到指定教材版面。");
        const classroomState = { id: "STATE-" + board.id, boardId: board.id, page: Math.max(1, Number(data.page) || 1), zoom: clamp(Number(data.zoom) || 1, .6, 2.2), updatedAt: new Date().toISOString() };
        await localPut("classroomState", classroomState);
        return { ok: true, state: classroomState };
      }
      if (action === "listBoards") return { ok: true, data: (await localAll("boards")).filter(function (board) { return board.status !== "封存"; }) };
      if (action === "getBoard") {
        const board = await localGet("boards", data.boardId);
        if (!board || board.status === "封存") throw new Error("找不到指定教材版面。");
        return { ok: true, board: board, areas: board.areas || [] };
      }
      if (action === "getFile") {
        const file = await localGet("files", data.fileId);
        if (!file) throw new Error("找不到本機檔案。");
        if (file.base64) return { ok: true, fileId: file.id, name: file.name, mime: file.mime || "application/octet-stream", base64: file.base64 };
        const parts = dataUrlParts(file.dataUrl);
        return { ok: true, fileId: file.id, name: file.name, mime: file.mime || parts.mime, base64: parts.base64 };
      }
      if (action === "createBoard") {
        const board = { id: data.clientBoardId || createId("B"), name: String(data.name || "新教材").trim(), description: String(data.description || "").trim(), pdfFileId: "", pdfFileName: "", pdfMime: "", status: "啟用", areas: [], createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
        if (!board.name) throw new Error("請填寫教材版面名稱。");
        if (data.pdf && data.pdf.data) {
          const fileId = await localSaveFile(data.pdf, "PDF教材", board.id, "");
          board.pdfFileId = fileId;
          board.pdfFileName = data.pdf.name || "教材.pdf";
          board.pdfMime = data.pdf.mime || "application/pdf";
        }
        board.areas = Array.isArray(data.areas) ? data.areas : [];
        await localPut("boards", board);
        return { ok: true, board: board, areas: board.areas };
      }
      if (action === "updateBoard") {
        const board = await localGet("boards", data.boardId);
        if (!board) throw new Error("找不到指定教材版面。");
        board.name = String(data.name === undefined ? board.name : data.name).trim();
        board.description = String(data.description === undefined ? board.description : data.description).trim();
        if (data.pdf && data.pdf.data) {
          const fileId = await localSaveFile(data.pdf, "PDF教材", board.id, "");
          board.pdfFileId = fileId;
          board.pdfFileName = data.pdf.name || "教材.pdf";
          board.pdfMime = data.pdf.mime || "application/pdf";
        }
        if (data.areas !== undefined) {
          await removeLocalSubmissionsForRemovedAreas(board.id, data.areas);
          board.areas = data.areas;
        }
        board.updatedAt = new Date().toISOString();
        await localPut("boards", board);
        return { ok: true, board: board, areas: board.areas || [] };
      }
      if (action === "archiveBoard") {
        const board = await localGet("boards", data.boardId);
        if (board) { board.status = "封存"; board.updatedAt = new Date().toISOString(); await localPut("boards", board); }
        return { ok: true, board: board };
      }
      if (action === "deleteBoard") {
        const board = await localGet("boards", data.boardId);
        const deleted = await removeLocalBoardData(data.boardId);
        return { ok: true, board: board, deleted: deleted };
      }
      if (action === "saveSubmission") {
        const board = await localGet("boards", data.boardId);
        if (!board) throw new Error("找不到指定教材版面。");
        const existing = await localGet("submissions", data.id);
        const imageIds = Array.isArray(data.keepImageFileIds) ? data.keepImageFileIds.slice(0, MAX_IMAGE_COUNT) : [];
        const imageNames = Array.isArray(data.keepImageFileNames) ? data.keepImageFileNames.slice(0, MAX_IMAGE_COUNT) : [];
        for (const image of Array.isArray(data.images) ? data.images.slice(0, MAX_IMAGE_COUNT) : []) {
          const fileId = await localSaveFile(image, "學生答案照片", board.id, data.id);
          imageIds.push(fileId);
          imageNames.push(image.name || "答案照片.jpg");
        }
        if (!String(data.text || "").trim() && !imageIds.length) throw new Error("請輸入文字或上傳至少一張照片。");
        const submission = { id: data.id || createId("S"), boardId: board.id, areaId: data.areaId, nickname: String(data.nickname || "").trim(), text: String(data.text || "").trim(), imageFileIds: imageIds.slice(0, MAX_IMAGE_COUNT), imageFileNames: imageNames.slice(0, MAX_IMAGE_COUNT), teacherStrokes: {}, teacherComment: "", status: "待批改", clientId: data.clientId || "", createdAt: existing ? existing.createdAt : new Date().toISOString(), updatedAt: new Date().toISOString() };
        if (!submission.nickname) throw new Error("請先輸入暱稱。");
        await localPut("submissions", submission);
        return { ok: true, submission: submission };
      }
      if (action === "listSubmissions") {
        const rows = (await localAll("submissions")).filter(function (item) { return String(item.boardId) === String(data.boardId) && (data.role === "teacher" || (data.nickname && item.nickname === data.nickname)); });
        rows.sort(function (a, b) { return String(b.updatedAt).localeCompare(String(a.updatedAt)); });
        return { ok: true, data: rows };
      }
      if (action === "saveFeedback") {
        const item = await localGet("submissions", data.submissionId);
        if (!item) throw new Error("找不到指定作答紀錄。");
        item.teacherStrokes = data.strokes || { photoIndex: 0, strokes: [] };
        item.teacherComment = String(data.comment || "").trim();
        item.status = "已批改";
        item.updatedAt = new Date().toISOString();
        await localPut("submissions", item);
        return { ok: true, submissionId: item.id, submission: item };
      }
      if (action === "deleteSubmission") {
        const item = await localGet("submissions", data.submissionId);
        if (item) {
          await localDelete("submissions", data.submissionId);
          const fileIds = Array.isArray(item.imageFileIds) ? item.imageFileIds : [];
          for (const fileId of fileIds) {
            await localDelete("files", fileId);
            state.imageCache.delete(fileId);
          }
        }
        return { ok: true, submissionId: data.submissionId, deleted: true };
      }
      throw new Error("未知的本機操作。");
    }

    class ApiError extends Error {
      constructor(message, network) {
        super(message);
        this.network = Boolean(network);
      }
    }

    async function gasPost(action, payload) {
      if (!GAS_URL) throw new ApiError("尚未設定 GAS 網址。", true);
      const form = new FormData();
      form.append("action", action);
      form.append("data", JSON.stringify(payload || {}));
      try {
        const response = await fetch(GAS_URL, { method: "POST", body: form });
        const result = await response.json();
        if (!result.ok) throw new ApiError(result.error || "GAS 操作失敗。", false);
        state.consecutiveNetworkErrors = 0;
        setOfflineNote(false);
        return result;
      } catch (error) {
        state.consecutiveNetworkErrors = (state.consecutiveNetworkErrors || 0) + 1;
        if (state.consecutiveNetworkErrors >= 3 || !navigator.onLine) setOfflineNote(true);
        if (error instanceof ApiError) throw error;
        throw new ApiError(error.message || "網路連線失敗。", true);
      }
    }

    async function gasGet(action, params) {
      if (!GAS_URL) throw new ApiError("尚未設定 GAS 網址。", true);
      const query = new URLSearchParams(Object.assign({ action: action }, params || {}));
      try {
        const response = await fetch(GAS_URL + (GAS_URL.indexOf("?") > -1 ? "&" : "?") + query.toString());
        const result = await response.json();
        if (!result.ok) throw new ApiError(result.error || "GAS 操作失敗。", false);
        state.consecutiveNetworkErrors = 0;
        setOfflineNote(false);
        return result;
      } catch (error) {
        state.consecutiveNetworkErrors = (state.consecutiveNetworkErrors || 0) + 1;
        if (state.consecutiveNetworkErrors >= 3 || !navigator.onLine) setOfflineNote(true);
        if (error instanceof ApiError) throw error;
        throw new ApiError(error.message || "網路連線失敗。", true);
      }
    }

    async function api(action, payload) {
      if (state.demo) return localRequest(action, payload || {});
      return gasPost(action, payload || {});
    }

    async function managerApi(action, payload) {
      const data = Object.assign({}, payload || {}, state.adminToken ? { adminToken: state.adminToken } : {});
      try {
        return await api(action, data);
      } catch (error) {
        if (!state.demo && !error.network && /管理權限|教師管理/.test(error.message || "")) {
          const authenticated = await promptAdminLogin();
          if (!authenticated) throw new ApiError("已取消教師管理驗證。", false);
          data.adminToken = state.adminToken;
          return api(action, data);
        }
        throw error;
      }
    }

    async function commitLocalMutation(action, payload) {
      const result = await localRequest(action, payload || {});
      if (!state.demo) {
        const saved = result && (result.submission || result.annotation || result.state || result.board);
        await queueOutbox(action, payload || {}, saved && saved.updatedAt);
        window.setTimeout(function () { flushOutbox(); }, 0);
      }
      return result;
    }

    async function hasPendingBoardMutation(boardId) {
      const items = await localAll("outbox");
      return items.some(function (item) {
        const payload = item.payload || {};
        const id = payload.boardId || payload.clientBoardId;
        return String(id || "") === String(boardId) && ["createBoard", "updateBoard", "archiveBoard", "deleteBoard"].indexOf(item.action) > -1;
      });
    }

    async function cacheBoardLocally(board, areas) {
      if (!board || !board.id) return;
      try {
        const existing = await localGet("boards", board.id);
        if (existing && existing.updatedAt && board.updatedAt && String(existing.updatedAt) > String(board.updatedAt)) return;
        await localPut("boards", Object.assign({}, existing || {}, board, { areas: Array.isArray(areas) ? areas : (existing && existing.areas) || [] }));
      } catch (error) {
        // 本機快取失敗時仍可使用網路資料。
      }
    }

    async function mergePendingBoards(remoteBoards) {
      const boardMap = new Map((remoteBoards || []).map(function (board) { return [String(board.id), board]; }));
      const pending = (await localAll("outbox")).sort(function (a, b) { return (Number(a.sequence) || Date.parse(a.createdAt) || 0) - (Number(b.sequence) || Date.parse(b.createdAt) || 0); });
      const pendingByBoard = new Map();
      pending.forEach(function (item) {
        const payload = item.payload || {};
        const id = payload.boardId || payload.clientBoardId;
        if (id && ["createBoard", "updateBoard", "archiveBoard", "deleteBoard"].indexOf(item.action) > -1) pendingByBoard.set(String(id), item.action);
      });
      const localBoards = await localAll("boards");
      localBoards.forEach(function (board) {
        const action = pendingByBoard.get(String(board.id));
        const remote = boardMap.get(String(board.id));
        if (!action && remote && board.updatedAt && remote.updatedAt && String(board.updatedAt) > String(remote.updatedAt)) {
          if (board.status !== "封存") boardMap.set(String(board.id), board);
          return;
        }
        if (!action) return;
        if (action === "archiveBoard" || action === "deleteBoard" || board.status === "封存") boardMap.delete(String(board.id));
        else boardMap.set(String(board.id), board);
      });
      return Array.from(boardMap.values());
    }

    async function pruneStaleLocalBoards(remoteBoards) {
      const remoteIds = new Set((remoteBoards || []).map(function (board) { return String(board.id); }));
      const pendingBoardIds = new Set((await localAll("outbox")).filter(function (item) {
        return ["createBoard", "updateBoard", "archiveBoard", "deleteBoard"].indexOf(item.action) > -1;
      }).map(function (item) { const payload = item.payload || {}; return String(payload.boardId || payload.clientBoardId || ""); }));
      for (const board of await localAll("boards")) {
        if (!remoteIds.has(String(board.id)) && !pendingBoardIds.has(String(board.id))) await localDelete("boards", board.id);
      }
    }

    async function mergePendingSubmissions(remoteRows, boardId, nickname) {
      const pendingIds = new Set((await localAll("outbox")).filter(function (item) {
        return ["saveSubmission", "saveFeedback"].indexOf(item.action) > -1;
      }).map(function (item) { return String((item.payload || {}).id || (item.payload || {}).submissionId || ""); }));
      const deletedIds = new Set((await localAll("outbox")).filter(function (item) {
        return item.action === "deleteSubmission";
      }).map(function (item) { return String((item.payload || {}).submissionId || ""); }));
      const rows = new Map((remoteRows || []).filter(function (item) { return !deletedIds.has(String(item.id)); }).map(function (item) { return [String(item.id), item]; }));
      (await localAll("submissions")).forEach(function (item) {
        if (deletedIds.has(String(item.id))) return;
        if (String(item.boardId) !== String(boardId) || (nickname && String(item.nickname) !== String(nickname))) return;
        const remote = rows.get(String(item.id));
        if (pendingIds.has(String(item.id)) || !remote || (item.updatedAt && remote.updatedAt && String(item.updatedAt) > String(remote.updatedAt))) rows.set(String(item.id), item);
      });
      return Array.from(rows.values());
    }

    async function pendingInkRows(boardId) {
      const pendingIds = new Set((await localAll("outbox")).filter(function (item) {
        return item.action === "saveInk" && String((item.payload || {}).boardId) === String(boardId);
      }).map(function (item) { return String((item.payload || {}).id || ""); }));
      return (await localAll("ink")).filter(function (item) { return String(item.boardId) === String(boardId) && pendingIds.has(String(item.id)); });
    }

    async function pendingClassroomState(boardId) {
      const pending = (await localAll("outbox")).some(function (item) {
        return item.action === "saveClassroomState" && String((item.payload || {}).boardId) === String(boardId);
      });
      return pending ? localGet("classroomState", "STATE-" + boardId) : null;
    }

    async function promptAdminLogin() {
      const result = await openFormModal("教師管理驗證", "<form><div class=\"field\"><label for=\"adminPasswordField\">管理密語</label><input id=\"adminPasswordField\" name=\"password\" type=\"password\" autocomplete=\"current-password\" required></div><p class=\"helper\">若「系統設定」尚未填入 AdminPassword，系統會直接建立暫時管理工作階段。</p></form>", "驗證", async function (formData) {
        const response = await gasPost("verifyAdmin", { password: formData.get("password") || "", clientId: state.clientId });
        state.adminToken = response.token || "";
        if (state.adminToken) localStorage.setItem(APP_KEY + "admin_token", state.adminToken);
        return true;
      });
      return result === true;
    }

    function cachedFileResult(file) {
      if (!file) return null;
      if (file.base64) return { ok: true, fileId: file.id, name: file.name, mime: file.mime || "application/octet-stream", base64: file.base64 };
      if (!file.dataUrl) return null;
      const parts = dataUrlParts(file.dataUrl);
      return { ok: true, fileId: file.id, name: file.name, mime: file.mime || parts.mime, base64: parts.base64 };
    }

    async function getFileWithCache(fileId, boardId) {
      if (!fileId) return null;
      const cached = cachedFileResult(await localGet("files", fileId));
      if (cached) return cached;
      const result = await api("getFile", { fileId: fileId, boardId: boardId });
      try {
        await localPut("files", { id: result.fileId || fileId, name: result.name || "檔案", mime: result.mime || "application/octet-stream", base64: result.base64 || "", size: result.size || 0, boardId: boardId || "", cachedAt: new Date().toISOString() });
      } catch (error) {
        // 本機快取失敗時仍保留本次網路結果。
      }
      return result;
    }

    async function fetchFileData(fileId, boardId) {
      if (!fileId) return null;
      if (state.imageCache.has(fileId)) return state.imageCache.get(fileId);
      const result = await getFileWithCache(fileId, boardId);
      const dataUrl = base64ToDataUrl(result.base64, result.mime);
      state.imageCache.set(fileId, dataUrl);
      return dataUrl;
    }

    async function loadBoardContext(boardId) {
      const cachedBoard = await localGet("boards", boardId);
      let result;
      if (cachedBoard) {
        result = { board: cachedBoard, areas: cachedBoard.areas || [] };
        if (!state.demo && navigator.onLine) {
          api("getBoard", { boardId: boardId }).then(async function (remote) {
            if (remote && remote.board) {
              const isNewer = !cachedBoard.updatedAt || String(remote.board.updatedAt) >= String(cachedBoard.updatedAt);
              if (isNewer) {
                await cacheBoardLocally(remote.board, remote.areas || []);
                if (String(state.boardId) === String(boardId)) {
                  state.board = remote.board;
                  state.areas = Array.isArray(remote.areas) ? remote.areas : [];
                  renderZones();
                  renderReviewAreaList();
                }
              }
            }
          }).catch(function () {});
        }
      } else {
        try {
          result = await api("getBoard", { boardId: boardId });
          await cacheBoardLocally(result.board, result.areas || []);
        } catch (error) {
          throw error;
        }
      }
      state.board = result.board;
      state.boardId = result.board.id;
      state.areas = Array.isArray(result.areas) ? result.areas : [];
      state.pdf = null;
      state.pdfBytes = null;
      state.teacherInk.clear();
      state.teacherInkVersion = "";
      state.currentPage = 1;
      state.zoom = 1;
      if (state.board.pdfFileId) {
        if (!window.pdfjsLib) throw new Error("PDF 引擎尚未載入，請確認網路連線後重試。");
        const file = await getFileWithCache(state.board.pdfFileId, state.board.id);
        state.pdfBytes = base64ToBytes(file.base64);
        state.pdf = await window.pdfjsLib.getDocument({ data: state.pdfBytes }).promise;
      }
      return state.board;
    }

    function goView(view, boardId) {
      state.view = view;
      state.boardId = boardId || "";
      const url = new URL(window.location.href);
      url.search = "";

      if (view === "editor" || view === "review") {
        url.searchParams.set("view", view);
        url.searchParams.set("board", boardId);
      }
      window.history.pushState({}, "", url);
      renderRoute();

      const params = new URLSearchParams(window.location.search);
      const boardId = params.get("board") || "";
      const view = params.get("view") || (boardId ? "student" : "manager");
      return { view: view, boardId: boardId };
