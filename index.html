     function isInkGestureExcludedTarget(target) {
       const element = target && target.nodeType === 1 ? target : target && target.parentElement;
       return Boolean(element && element.closest && element.closest(".zone, button, input, select, textarea, label, a, .classroom-page-nav"));
     }

     function toggleTeacherInkFromGesture(event) {
       if ((state.view !== "review" && state.view !== "editor") || !state.board || !state.pdf || isInkGestureExcludedTarget(event.target)) return false;
       if (event && typeof event.preventDefault === "function") event.preventDefault();
       setTeacherInkMode(!state.drawingInk);
       return true;
     }

     function bindTeacherInkToggleGesture(scroll) {
       if (!scroll || scroll.dataset.inkGestureBound === "1") return;
       scroll.dataset.inkGestureBound = "1";
       let lastTouchTap = null;
       let ignoreNativeDblClickUntil = 0;
       scroll.addEventListener("dblclick", function (event) {
         if (performance.now() < ignoreNativeDblClickUntil) return;
         toggleTeacherInkFromGesture(event);
       });
       scroll.addEventListener("pointerup", function (event) {
         if (event.pointerType !== "touch") return;
         if (isInkGestureExcludedTarget(event.target)) { lastTouchTap = null; return; }
         const now = performance.now();
         const point = { x: event.clientX, y: event.clientY };
         if (lastTouchTap && now - lastTouchTap.time <= 350 && Math.hypot(point.x - lastTouchTap.x, point.y - lastTouchTap.y) <= 40) {
           lastTouchTap = null;
           ignoreNativeDblClickUntil = now + 500;
           toggleTeacherInkFromGesture(event);
         } else {
           lastTouchTap = { x: point.x, y: point.y, time: now };
         }
       });
       scroll.addEventListener("pointercancel", function () { lastTouchTap = null; });
     }

    function bindPdfSwipe(scroll) {
      if (!scroll || scroll.dataset.swipeBound === "1") return;
      scroll.dataset.swipeBound = "1";
      let startTouch = null;
      let initialPinchDistance = 0;
      let initialZoom = 1;
      let isPinching = false;
      let lastPinchScale = 1;

      function getPinchDist(e) {
        if (!e.touches || e.touches.length < 2) return 0;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        return Math.hypot(dx, dy);
      }

      scroll.addEventListener("touchstart", function (event) {
        if (state.drawingInk) return;
        if (event.touches.length === 2) {
          isPinching = true;
          startTouch = null;
          initialPinchDistance = getPinchDist(event);
          initialZoom = state.zoom || 1;
          lastPinchScale = 1;
          const stage = scroll.querySelector(".page-stage");
          if (stage) {
            stage.style.transformOrigin = "center top";
            stage.style.transition = "none";
          }
        } else if (event.touches.length === 1 && !isPinching) {
          const touch = event.touches[0];
          startTouch = { x: touch.clientX, y: touch.clientY, time: performance.now() };
        }
      }, { passive: false });

      scroll.addEventListener("touchmove", function (event) {
        if (state.drawingInk) return;
        if (event.touches.length === 2 && isPinching && initialPinchDistance > 0) {
          event.preventDefault();
          const currDist = getPinchDist(event);
          if (currDist > 0) {
            lastPinchScale = currDist / initialPinchDistance;
            const stage = scroll.querySelector(".page-stage");
            if (stage) {
              stage.style.transform = "scale(" + lastPinchScale + ")";
            }
          }
        }
      }, { passive: false });

      scroll.addEventListener("touchend", function (event) {
        if (isPinching) {
          if (event.touches.length < 2) {
            isPinching = false;
            const stage = scroll.querySelector(".page-stage");
            if (stage) {
              stage.style.transform = "";
              stage.style.transition = "";
            }
            if (lastPinchScale && Math.abs(lastPinchScale - 1) > 0.04) {
              const newZoom = clamp(initialZoom * lastPinchScale, 0.5, 3.0);
              setZoom(newZoom);
            }
            initialPinchDistance = 0;
            lastPinchScale = 1;
          }
          return;
        }
        if (!startTouch || state.drawingInk || !event.changedTouches.length) {
          startTouch = null;
          return;
        }
        const touch = event.changedTouches[0];
        const dx = touch.clientX - startTouch.x;
        const dy = touch.clientY - startTouch.y;
        const dt = performance.now() - startTouch.time;
        startTouch = null;
        if (dt < 400 && Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          changePage(dx < 0 ? 1 : -1);
        }
      }, { passive: false });

      scroll.addEventListener("touchcancel", function () {
        if (isPinching) {
          isPinching = false;
          const stage = scroll.querySelector(".page-stage");
          if (stage) {
            stage.style.transform = "";
            stage.style.transition = "";
          }
        }
        startTouch = null;
        initialPinchDistance = 0;
        lastPinchScale = 1;
      }, { passive: true });

      scroll.addEventListener("wheel", function (event) {
        if (event.ctrlKey || event.metaKey) {
          event.preventDefault();
          const delta = -event.deltaY;
          const factor = delta > 0 ? 1.08 : 0.92;
          setZoom(clamp(state.zoom * factor, 0.5, 3.0));
        }
      }, { passive: false });
    }

    function bindInkControls() {
      const controls = document.getElementById("inkControls");
      const color = document.getElementById("inkColorField");
      if (!controls || controls.dataset.bound === "1") return;
      controls.dataset.bound = "1";
      controls.querySelectorAll("[data-ink-tool]").forEach(function (button) { button.addEventListener("click", function () { state.inkTool = button.dataset.inkTool; updateInkControls(); }); });
      controls.querySelectorAll("[data-ink-shape]").forEach(function (button) { button.addEventListener("click", function () { state.inkShape = button.dataset.inkShape; updateInkControls(); }); });
      controls.querySelectorAll("[data-ink-color]").forEach(function (button) { button.addEventListener("click", function () { state.inkColor = button.dataset.inkColor; updateInkControls(); }); });
      controls.querySelectorAll("[data-ink-width]").forEach(function (button) {
        button.addEventListener("click", function () {
          state.inkWidth = Number(button.dataset.inkWidth) || 4;
          updateInkControls();
        });
      });
      if (color) color.addEventListener("input", function (event) { state.inkColor = event.target.value; });
    }

    function updateInkControls() {
      const color = document.getElementById("inkColorField");
      const button = document.getElementById("teacherInkButton");
      const shapeButtons = document.getElementById("inkShapeButtons");
      document.querySelectorAll("[data-ink-tool]").forEach(function (item) { item.classList.toggle("active", item.dataset.inkTool === state.inkTool); });
      document.querySelectorAll("[data-ink-shape]").forEach(function (item) { item.classList.toggle("active", item.dataset.inkShape === state.inkShape); });
      document.querySelectorAll("[data-ink-color]").forEach(function (item) { item.classList.toggle("active", item.dataset.inkColor.toLowerCase() === state.inkColor.toLowerCase()); });
      document.querySelectorAll("[data-ink-width]").forEach(function (item) { item.classList.toggle("active", Number(item.dataset.inkWidth) === Number(state.inkWidth)); });
      if (color) color.value = state.inkColor;
      if (shapeButtons) shapeButtons.hidden = state.inkTool !== "shape";
      if (button) { button.classList.toggle("active", state.drawingInk); button.textContent = state.drawingInk ? "停止手寫" : "✎ 手寫"; }
      const canvas = document.getElementById("inkCanvas");
      const layer = document.getElementById("zoneLayer");
      if (canvas) {
        canvas.classList.toggle("is-drawing", state.drawingInk);
        canvas.style.touchAction = state.drawingInk ? "none" : "pan-x pan-y";
      }
      if (layer) layer.classList.toggle("ink-mode", state.drawingInk);
    }

    function setInkStatus(message) {
      const status = document.getElementById("inkStatus");
      if (status) status.textContent = message;
    }

    function setTeacherInkMode(enabled) {
      state.drawingInk = Boolean(enabled);
      if (state.drawingInk) {
        state.drawingZone = false;
        const pinButton = document.getElementById("drawZoneButton");
        const layer = document.getElementById("zoneLayer");
        if (pinButton) { pinButton.classList.remove("active"); pinButton.textContent = "＋ 放置圖釘"; }
        if (layer) layer.classList.remove("is-placing");
      }
      updateInkControls();
      renderTeacherInk();
    }

    function toggleTeacherInk() {
      setTeacherInkMode(!state.drawingInk);
    }

    async function loadTeacherInk() {
      state.teacherInk.clear();
      let result;
      try {
        result = await managerApi("listInk", { boardId: state.boardId });
      } catch (error) {
        if (!error.network) throw error;
        result = await localRequest("listInk", { boardId: state.boardId });
      }
      const rows = new Map((result.data || []).map(function (item) { return [String(item.id), item]; }));
      (await pendingInkRows(state.boardId)).forEach(function (item) { rows.set(String(item.id), item); });
      state.teacherInk.clear();
      Array.from(rows.values()).forEach(function (item) {
        state.teacherInk.set(Number(item.page) || 1, Array.isArray(item.strokes) ? item.strokes : []);
      });
      state.teacherInkVersion = String(result.inkVersion || "");
      setInkStatus("手寫已載入");
    }

    function teacherInkForPage(page) {
      return state.teacherInk.get(Number(page)) || [];
    }

    function scheduleTeacherInkSave() {
      const page = Number(state.currentPage) || 1;
      window.clearTimeout(state.inkSaveTimer);
      state.inkSaveTimer = window.setTimeout(function () { persistTeacherInk(page); }, 450);
      setInkStatus("手寫暫存中");
    }

    async function persistTeacherInk(page) {
      if (!state.board) return;
      const strokes = JSON.parse(JSON.stringify(teacherInkForPage(page)));
      const payload = { id: "INK-" + state.board.id + "-" + page, boardId: state.board.id, page: page, strokes: strokes };
      try {
        const result = await commitLocalMutation("saveInk", payload);
        if (result.annotation && Number(page) === Number(state.currentPage)) state.teacherInk.set(page, result.annotation.strokes || strokes);
        setInkStatus(state.demo ? "手寫已保存" : "手寫已本機保存，背景同步中");
      } catch (error) {
        setInkStatus("手寫本機保存失敗");
        await showModal("手寫保存失敗", error.message || "請稍後再試。", "error");
      }
    }

    async function loadClassroomSync() {
      if (!state.boardId) return;
      let result;
      const syncPayload = { boardId: state.boardId, inkVersion: state.teacherInkVersion };
      try {
        result = state.demo ? await localRequest("classroomSync", syncPayload) : await gasGet("classroomSync", syncPayload);
      } catch (error) {
        if (!error.network) return;
        setOfflineNote(true);
        try {
          result = await localRequest("classroomSync", syncPayload);
        } catch (localError) {
          return;
        }
      }
      const pendingInk = await pendingInkRows(state.boardId);
      if (pendingInk.length) {
        const inkRows = new Map((Array.isArray(result.ink) ? result.ink : []).map(function (item) { return [String(item.id), item]; }));
        pendingInk.forEach(function (item) { inkRows.set(String(item.id), item); });
        result.ink = Array.from(inkRows.values());
        result.inkChanged = true;
      }
      const pendingState = state.view === "student" ? null : await pendingClassroomState(state.boardId);
      if (pendingState) result.state = pendingState;
      if (result.inkVersion !== undefined) state.teacherInkVersion = String(result.inkVersion || "");
      if (result.inkChanged !== false && Array.isArray(result.ink)) {
        state.teacherInk.clear();
        result.ink.forEach(function (item) {
          state.teacherInk.set(Number(item.page) || 1, Array.isArray(item.strokes) ? item.strokes : []);
        });
      }
      if (state.view === "student") {
        renderTeacherInk();
        return;
      }
      const shared = result.state || {};
      const maxPage = state.pdf ? state.pdf.numPages : Math.max(1, Number(shared.page) || 1);
      const nextPage = clamp(Number(shared.page) || 1, 1, maxPage);
      const nextZoom = clamp(Number(shared.zoom) || 1, .6, 2.2);
      const pageChanged = Number(state.currentPage) !== Number(nextPage);
      const zoomChanged = Number(state.zoom) !== Number(nextZoom);
      state.currentPage = nextPage;
      state.zoom = nextZoom;
      if (pageChanged || zoomChanged) await renderPdfPage();
      else { renderTeacherInk(); updatePdfToolbar(); }
    }

    function scheduleClassroomStateSave() {
      if (state.view !== "review" || !state.board) return;
      window.clearTimeout(state.classroomStateTimer);
      state.classroomStateTimer = window.setTimeout(function () { persistClassroomState(); }, 300);
    }

    async function persistClassroomState() {
      if (state.view !== "review" || !state.board) return;
      const payload = { id: "STATE-" + state.board.id, boardId: state.board.id, page: state.currentPage, zoom: state.zoom };
      try {
        await commitLocalMutation("saveClassroomState", payload);
      } catch (error) {
        await showModal("課堂狀態保存失敗", error.message || "請稍後再試。", "error");
      }
    }

    async function undoTeacherInk() {
      const strokes = teacherInkForPage(state.currentPage);
      if (!strokes.length) return;
      strokes.pop();
      state.teacherInk.set(Number(state.currentPage), strokes);
      renderTeacherInk();
      scheduleTeacherInkSave();
    }

    async function clearTeacherInk() {
      const ok = await showModal("清除本頁手寫", "只會清除目前 PDF 頁面的教師手寫，確定嗎？", "confirm");
      if (!ok) return;
      state.teacherInk.set(Number(state.currentPage), []);
      renderTeacherInk();
      await persistTeacherInk(Number(state.currentPage));
    }

    async function clearAllTeacherInk() {
      const ok = await showModal("全部清除教師手寫", "會清除這份教材所有頁面的教師手寫，確定嗎？", "confirm");
      if (!ok) return;
      const pages = new Set(Array.from(state.teacherInk.keys()).concat([Number(state.currentPage) || 1]));
      state.teacherInk.clear();
      renderTeacherInk();
      for (const page of pages) await persistTeacherInk(page);
    }

    function togglePencilEraser() {
      if (document.getElementById("reviewCanvas") && state.reviewSubmission) {
        if (state.reviewTool !== "eraser") {
          state.previousReviewTool = state.reviewTool || "pen";
          state.reviewTool = "eraser";
          showToast("已切換為橡皮擦。", "info");
        } else {
          state.reviewTool = state.previousReviewTool || "pen";
          const label = state.reviewTool === "highlighter" ? "螢光筆" : (state.reviewTool === "shape" ? "圖形" : "手寫筆");
          showToast("已切換回" + label + "。", "info");
        }
        updateReviewInkControls();
        return;
      }
      if (state.view === "review" || state.view === "editor") {
        if (!state.drawingInk) setTeacherInkMode(true);
        if (state.inkTool !== "eraser") {
          state.previousInkTool = state.inkTool || "pen";
          state.inkTool = "eraser";
          setInkStatus("Apple Pencil 切換為橡皮擦");
          showToast("已切換為橡皮擦。", "info");
        } else {
          state.inkTool = state.previousInkTool || "pen";
          const label = state.inkTool === "highlighter" ? "螢光筆" : (state.inkTool === "shape" ? "圖形" : "手寫筆");
          setInkStatus("Apple Pencil 切換回" + label);
          showToast("已切換回" + label + "。", "info");
        }
        updateInkControls();
      }
    }

    let teacherInkActivePointerId = null;
    let teacherInkActiveStroke = null;
    let teacherInkErasing = false;
    let teacherInkChanged = false;
    let teacherInkStartTime = 0;
    let teacherInkStartPoint = null;
    let teacherInkMoved = false;
    let lastTeacherTipTap = null;

    function bindTeacherInkCanvas() {
      const canvas = document.getElementById("inkCanvas");
      if (!canvas || canvas.dataset.bound === "1") return;
      canvas.dataset.bound = "1";
      canvas.style.touchAction = state.drawingInk ? "none" : "pan-x pan-y";
      canvas.style.willChange = "transform";
      canvas.addEventListener("pointerdown", beginTeacherInk);
      canvas.addEventListener("pointermove", moveTeacherInk);
      canvas.addEventListener("pointerup", finishTeacherInk);
      canvas.addEventListener("pointercancel", cancelTeacherInk);
    }

    function beginTeacherInk(event) {
      if (!state.pdf) return;
      if (teacherInkActivePointerId !== null) return;
      const isPen = event.pointerType === "pen";
      const isDrawing = Boolean(state.drawingInk);
      if (!isDrawing && !isPen) return;
      if (event.pointerType === "touch") {
        if (event.isPrimary === false) return;
        if (event.width > 65 && event.height > 65) return;
      }
      if (!isDrawing && isPen) {
        setTeacherInkMode(true);
        setInkStatus("Apple Pencil 自動啟用手寫");
      }
      event.preventDefault();
      teacherInkActivePointerId = event.pointerId;
      const canvas = document.getElementById("inkCanvas") || event.currentTarget;
      if (typeof canvas.setPointerCapture === "function") {
        try { canvas.setPointerCapture(event.pointerId); } catch (e) {}
      }
      const point = canvasPoint(event, canvas);
      teacherInkStartTime = performance.now();
      teacherInkStartPoint = point;
      teacherInkMoved = false;
      teacherInkChanged = false;
      if (state.inkTool === "eraser") {
        teacherInkErasing = true;
        eraseTeacherInkAt(point);
        return;
      }
      teacherInkActiveStroke = { tool: state.inkTool, shape: state.inkShape, color: state.inkColor, width: state.inkWidth / 800, points: [point] };
      renderTeacherInk();
    }

    function drawLiveSegment(canvas, stroke) {
      if (!canvas || !stroke) return;
      const context = canvas.getContext("2d");
      const scale = window.devicePixelRatio || 1;
      const width = Number(canvas.dataset.logicalWidth || canvas.clientWidth || canvas.width / scale);
      const height = Number(canvas.dataset.logicalHeight || canvas.clientHeight || canvas.height / scale);
      const pts = stroke.points;
      const len = pts.length;
      if (len < 2) return;
      context.save();
      context.scale(scale, scale);
      const baseWidth = Math.max(1, Number(stroke.width || .005) * Math.min(width, height));
      const isHighlighter = stroke.tool === "highlighter";
      const isPen = !isHighlighter && stroke.tool !== "eraser";
      let pressureScale = 1;
      if (isPen && len >= 2) {
        const p1 = pts[len - 2];
        const p2 = pts[len - 1];
        const avgPressure = ((p1.pressure !== undefined ? p1.pressure : 0.5) + (p2.pressure !== undefined ? p2.pressure : 0.5)) / 2;
        pressureScale = Math.max(0.7, Math.min(1.3, avgPressure * 0.8 + 0.6));
      }
      context.strokeStyle = stroke.color || "#d34f42";
      context.fillStyle = stroke.color || "#d34f42";
      context.lineWidth = isHighlighter ? Math.max(16, baseWidth * 6) : Math.max(1, baseWidth * pressureScale);
      context.lineCap = "round";
      context.lineJoin = "round";
      if (isHighlighter) context.globalAlpha = .35;
      
      const p0 = { x: pts[len - 2].x * width, y: pts[len - 2].y * height };
      const p1 = { x: pts[len - 1].x * width, y: pts[len - 1].y * height };
      context.beginPath();
      context.moveTo(p0.x, p0.y);
      context.lineTo(p1.x, p1.y);
      context.stroke();
      context.restore();
    }

    function moveTeacherInk(event) {
      if (event.pointerId !== teacherInkActivePointerId) return;
      if (!teacherInkActiveStroke && !teacherInkErasing) return;
      event.preventDefault();
      const canvas = document.getElementById("inkCanvas") || event.currentTarget;
      const events = typeof event.getCoalescedEvents === "function" ? event.getCoalescedEvents() : [event];
      if (!events.length) return;
      const lastPoint = canvasPoint(events[events.length - 1], canvas);
      if (teacherInkStartPoint && Math.hypot(lastPoint.x - teacherInkStartPoint.x, lastPoint.y - teacherInkStartPoint.y) > 0.008) {
        teacherInkMoved = true;
      }
      if (teacherInkErasing) {
        events.forEach(function (item) { eraseTeacherInkAt(canvasPoint(item, canvas)); });
        return;
      }
      if (!teacherInkActiveStroke) return;
      if (teacherInkActiveStroke.tool === "shape" || teacherInkActiveStroke.tool === "highlighter") {
        if (teacherInkActiveStroke.tool === "shape") {
          teacherInkActiveStroke.points = [teacherInkActiveStroke.points[0], lastPoint];
        } else {
          events.forEach(function (item) {
            teacherInkActiveStroke.points.push(canvasPoint(item, canvas));
          });
        }
        renderTeacherInk();
      } else {
        events.forEach(function (item) {
          teacherInkActiveStroke.points.push(canvasPoint(item, canvas));
          drawLiveSegment(canvas, teacherInkActiveStroke);
        });
      }
    }

    function finishTeacherInk(event) {
      if (event && event.pointerId !== teacherInkActivePointerId) return;
      teacherInkActivePointerId = null;
      const duration = performance.now() - teacherInkStartTime;
      const isTap = !teacherInkMoved && duration < 240;
      const pt = teacherInkStartPoint || (teacherInkActiveStroke && teacherInkActiveStroke.points[0]) || { x: 0, y: 0 };
      const now = performance.now();
      if (isTap && event && event.pointerType === "pen") {
        if (lastTeacherTipTap && (now - lastTeacherTipTap.time < 380) && Math.hypot(pt.x - lastTeacherTipTap.x, pt.y - lastTeacherTipTap.y) < 0.04) {
          lastTeacherTipTap = null;
          teacherInkActiveStroke = null;
          teacherInkErasing = false;
          teacherInkChanged = false;
          if (event && typeof event.stopPropagation === "function") event.stopPropagation();
          const strokes = teacherInkForPage(state.currentPage).slice();
          if (strokes.length > 0 && strokes[strokes.length - 1].points.length <= 2) strokes.pop();
          state.teacherInk.set(Number(state.currentPage), strokes);
          renderTeacherInk();
          scheduleTeacherInkSave();
          togglePencilEraser();
          return;
        }
        lastTeacherTipTap = { x: pt.x, y: pt.y, time: now };
      } else {
        lastTeacherTipTap = null;
      }
      if (teacherInkErasing) {
        teacherInkErasing = false;
        if (teacherInkChanged) scheduleTeacherInkSave();
        teacherInkChanged = false;
        return;
      }
      if (!teacherInkActiveStroke) return;
      const strokes = teacherInkForPage(state.currentPage).slice();
      strokes.push(teacherInkActiveStroke);
      state.teacherInk.set(Number(state.currentPage), strokes);
      teacherInkActiveStroke = null;
      renderTeacherInk();
      scheduleTeacherInkSave();
    }

    function cancelTeacherInk(event) {
      if (event && event.pointerId !== teacherInkActivePointerId) return;
      if (teacherInkActiveStroke && teacherInkActiveStroke.points && teacherInkActiveStroke.points.length > 1) {
        finishTeacherInk(event);
      } else {
        teacherInkActivePointerId = null;
        teacherInkActiveStroke = null;
        teacherInkErasing = false;
        teacherInkChanged = false;
        renderTeacherInk();
      }
    }

    function eraseTeacherInkAt(point) {
      const strokes = teacherInkForPage(state.currentPage);
      const kept = strokes.filter(function (stroke) {
        const strokeW = Number(stroke.width || .005);
        const mult = stroke.tool === "highlighter" ? 6 : 1;
        const threshold = Math.max(0.015, strokeW * mult * 1.6);
        const points = Array.isArray(stroke.points) ? stroke.points : [];
        for (let index = 0; index < points.length; index += 1) {
          if (distanceToSegment(point, points[index], points[index + 1] || points[index]) <= threshold) return false;
        }
        return true;
      });
      if (kept.length !== strokes.length) {
        state.teacherInk.set(Number(state.currentPage), kept);
        teacherInkChanged = true;
        renderTeacherInk();
      }
    }

    function distanceToSegment(point, start, end) {
      const dx = end.x - start.x;
      const dy = end.y - start.y;
      if (!dx && !dy) return Math.hypot(point.x - start.x, point.y - start.y);
      const ratio = clamp(((point.x - start.x) * dx + (point.y - start.y) * dy) / (dx * dx + dy * dy), 0, 1);
      return Math.hypot(point.x - (start.x + ratio * dx), point.y - (start.y + ratio * dy));
    }

    function renderTeacherInk() {
      const canvas = document.getElementById("inkCanvas");
      const pdfCanvas = document.getElementById("pdfCanvas");
      if (!canvas || !pdfCanvas) return;
      const width = Number.parseFloat(pdfCanvas.style.width) || pdfCanvas.clientWidth;
      const height = Number.parseFloat(pdfCanvas.style.height) || pdfCanvas.clientHeight;
      if (!width || !height) return;
      const scale = window.devicePixelRatio || 1;
      const targetWidth = Math.max(1, Math.floor(width * scale));
      const targetHeight = Math.max(1, Math.floor(height * scale));
      if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
        canvas.width = targetWidth;
        canvas.height = targetHeight;
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        canvas.dataset.logicalWidth = width;
        canvas.dataset.logicalHeight = height;
      }
      const teacherView = state.view === "editor" || state.view === "review" || state.view === "student";
      const strokes = teacherInkForPage(state.currentPage).slice();
      if (teacherInkActiveStroke) strokes.push(teacherInkActiveStroke);
      canvas.classList.toggle("visible", teacherView && (strokes.length > 0 || state.drawingInk || state.view === "review" || state.view === "editor"));
      canvas.classList.toggle("is-drawing", state.drawingInk);
      drawTeacherInkStrokes(canvas, strokes);
    }

    function drawTeacherInkStrokes(canvas, strokes) {
      const context = canvas.getContext("2d");
      const scale = window.devicePixelRatio || 1;
      const width = Number(canvas.dataset.logicalWidth || canvas.clientWidth || canvas.width / scale);
      const height = Number(canvas.dataset.logicalHeight || canvas.clientHeight || canvas.height / scale);
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.save();
      context.scale(scale, scale);
      (strokes || []).forEach(function (stroke) { drawTeacherStroke(context, width, height, stroke); });
      context.restore();
    }

    function drawTeacherStroke(context, width, height, stroke) {
      const points = Array.isArray(stroke.points) ? stroke.points : [];
      if (!points.length) return;
      const first = { x: Number(points[0].x || 0) * width, y: Number(points[0].y || 0) * height };
      const last = { x: Number(points[points.length - 1].x || 0) * width, y: Number(points[points.length - 1].y || 0) * height };
      const baseWidth = Math.max(1, Number(stroke.width || .005) * Math.min(width, height));
      context.save();
      context.strokeStyle = stroke.color || "#d34f42";
      context.fillStyle = stroke.color || "#d34f42";
      context.lineWidth = stroke.tool === "highlighter" ? Math.max(16, baseWidth * 6) : baseWidth;
      context.lineCap = "round";
      context.lineJoin = "round";
      if (stroke.tool === "highlighter") context.globalAlpha = .35;
      if (stroke.tool === "shape") {
        if (stroke.shape === "rect") context.strokeRect(first.x, first.y, last.x - first.x, last.y - first.y);
        else if (stroke.shape === "circle") {
          context.beginPath();
          context.ellipse((first.x + last.x) / 2, (first.y + last.y) / 2, Math.abs(last.x - first.x) / 2, Math.abs(last.y - first.y) / 2, 0, 0, Math.PI * 2);
          context.stroke();
        } else {
          context.beginPath();
          context.moveTo(first.x, first.y);
          context.lineTo(last.x, last.y);
          context.stroke();
          if (stroke.shape === "arrow") {
            const angle = Math.atan2(last.y - first.y, last.x - first.x);
            const head = Math.max(8, context.lineWidth * 3);
            context.beginPath();
            context.moveTo(last.x, last.y);
            context.lineTo(last.x - head * Math.cos(angle - Math.PI / 6), last.y - head * Math.sin(angle - Math.PI / 6));
            context.moveTo(last.x, last.y);
            context.lineTo(last.x - head * Math.cos(angle + Math.PI / 6), last.y - head * Math.sin(angle + Math.PI / 6));
            context.stroke();
          }
        }
      } else if (points.length === 1) {
        context.beginPath();
        context.arc(first.x, first.y, Math.max(1.5, context.lineWidth / 2), 0, Math.PI * 2);
        context.fill();
      } else if (points.length === 2) {
        context.beginPath();
        context.moveTo(first.x, first.y);
        context.lineTo(last.x, last.y);
        context.stroke();
      } else {
        context.beginPath();
        context.moveTo(first.x, first.y);
        for (let i = 1; i < points.length - 1; i += 1) {
          const p1 = { x: Number(points[i].x || 0) * width, y: Number(points[i].y || 0) * height };
          const p2 = { x: Number(points[i + 1].x || 0) * width, y: Number(points[i + 1].y || 0) * height };
          const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
          context.quadraticCurveTo(p1.x, p1.y, mid.x, mid.y);
        }
        context.lineTo(last.x, last.y);
        context.stroke();
      }
      context.restore();
    }

    function compareAreasByPosition(a, b) {
      return (Number(a.page) || 1) - (Number(b.page) || 1) || (Number(a.y) || 0) - (Number(b.y) || 0) || (Number(a.x) || 0) - (Number(b.x) || 0) || (Number(a.order) || 0) - (Number(b.order) || 0) || String(a.id || "").localeCompare(String(b.id || ""));
    }

    function orderedAreas() {
      return state.areas.slice().sort(compareAreasByPosition);

    async function handlePdfReplace(event) {

      try {
        state.pendingPdf = { name: file.name, mime: "application/pdf", data: await fileToDataUrl(file) };
        state.pdfBytes = new Uint8Array(await file.arrayBuffer());
        state.pdf = await window.pdfjsLib.getDocument({ data: state.pdfBytes }).promise;

        state.areas = [];
        state.selectedAreaId = "";

     function placeZonePin(event) {
       if (!state.drawingZone || !state.pdf || event.target.closest(".zone")) return;
       event.preventDefault();
       const layer = document.getElementById("zoneLayer");
       const rect = layer.getBoundingClientRect();
       if (!rect.width || !rect.height) return;
       const defaultTitle = "問答區 " + (state.areas.length + 1);
       const area = { id: createId("Q"), page: state.currentPage, x: clamp((event.clientX - rect.left) / rect.width, 0, 1), y: clamp((event.clientY - rect.top) / rect.height, 0, 1), width: 0.03, height: 0.03, title: defaultTitle, autoTitle: defaultTitle, prompt: "請輸入你的答案，或拍照上傳。", order: state.areas.length + 1 };
       state.areas.push(area);

     }

     async function inferNearbyQuestionTitle(area) {
       if (!state.pdf || !area || typeof state.pdf.getPage !== "function") return;
       const pageNumber = Number(area.page) || 1;
        const defaultTitle = area.autoTitle || "問答區 " + (area.order || state.areas.length);
       try {
         const page = await state.pdf.getPage(pageNumber);
         const textContent = await page.getTextContent();
         const viewport = page.getViewport({ scale: 1 });
         const items = (textContent.items || []).map(function (item) {
           const text = String(item.str || "").replace(/\s+/g, " ").trim();
           const transform = item.transform || [];
           const x = Number(transform[4]);
           const baseline = Number(transform[5]);
           const height = Math.abs(Number(item.height) || Number(transform[3]) || 12);
           if (!text || !Number.isFinite(x) || !Number.isFinite(baseline)) return null;
           return { text: text, x: x, y: viewport.height - baseline - height, width: Math.max(0, Number(item.width) || 0), height: height };
         }).filter(Boolean);
         if (!items.length) return;
         const lines = [];
         items.sort(function (a, b) { return a.y - b.y || a.x - b.x; }).forEach(function (item) {
           const line = lines.find(function (candidate) { return Math.abs(candidate.y - item.y) <= Math.max(5, Math.min(candidate.height, item.height) * .8); });
           if (line) {
             line.items.push(item);
             line.y = (line.y + item.y) / 2;
             line.height = Math.max(line.height, item.height);
           } else {
             lines.push({ y: item.y, height: item.height, items: [item] });
           }
         });
         const targetX = Number(area.x) * viewport.width;
         const targetY = Number(area.y) * viewport.height;
         const verticalLimit = Math.max(viewport.height * .055, 42);
         const candidate = lines.map(function (line) {
           line.items.sort(function (a, b) { return a.x - b.x; });
           const left = line.items[0].x;
           const text = line.items.map(function (item) { return item.text; }).join(" ").replace(/\s+/g, " ").trim();
           return { text: text, score: Math.abs(line.y - targetY) + Math.min(180, Math.abs(left - targetX)) * .08, distance: Math.abs(line.y - targetY) };
         }).filter(function (line) { return line.text && line.distance <= verticalLimit; }).sort(function (a, b) { return a.score - b.score; })[0];
         if (!candidate) return;
         const title = candidate.text.slice(0, 28).trim();
         const current = state.areas.find(function (item) { return String(item.id) === String(area.id); });
          if (!current || current.title !== defaultTitle || !title) return;
          current.title = title + (candidate.text.length > 28 ? "…" : "");
          current.autoTitle = current.title;
         renderEditorAreaList();
         renderZones();
       } catch (error) {
         // PDF 沒有文字層時，保留預設標題即可。
       }
     }

      syncAreaOrder();
      renderEditorAreaList();
      renderZones();
      showToast("問答圖釘已刪除；儲存版面後將一併刪除該題作答紀錄。", "success");
    }

    function openAreaForm(area) {
       openFormModal("編輯問答區", "<form><div class=\"field\"><label for=\"areaTitleField\">區域標題</label><input id=\"areaTitleField\" name=\"title\" maxlength=\"100\" required value=\"" + escapeHtml(area.title || "") + "\"></div><div class=\"field\"><label for=\"areaPromptField\">學生看到的題目指示</label><textarea id=\"areaPromptField\" name=\"prompt\" maxlength=\"500\" required>" + escapeHtml(area.prompt || "") + "</textarea></div><p class=\"helper\">目前位置：第 " + area.page + " 頁。圖釘位置會隨 PDF 縮放保持對齊。</p></form>", "儲存問答區", async function (formData) {

    function renderPdfPage() {
      const token = ++state.renderToken;
      const render = pdfRenderQueue.then(function () { return renderPdfPageNow(token); }, function () { return renderPdfPageNow(token); });
      pdfRenderQueue = render.catch(function () {});
      return render;
    }

    async function renderPdfPageNow(token) {
      const stage = document.getElementById("pageStage");
      if (!stage) return;
      if (token !== state.renderToken) return;
      let canvas = document.getElementById("pdfCanvas");
      if (!canvas) {
        stage.innerHTML = "<canvas id=\"pdfCanvas\"></canvas><canvas id=\"inkCanvas\" class=\"ink-layer\"></canvas><div class=\"zone-layer\" id=\"zoneLayer\"></div>";
        canvas = document.getElementById("pdfCanvas");
      }
      if (!document.getElementById("inkCanvas")) {
        const inkCanvas = document.createElement("canvas");
        inkCanvas.id = "inkCanvas";
        inkCanvas.className = "ink-layer";
        stage.insertBefore(inkCanvas, document.getElementById("zoneLayer") || null);
      }
      if (!state.pdf) {
        canvas.style.display = "none";
        const layer = document.getElementById("zoneLayer");
        layer.innerHTML = "";
        const inkCanvas = document.getElementById("inkCanvas");
        if (inkCanvas) { inkCanvas.classList.remove("visible", "is-drawing"); inkCanvas.width = 1; inkCanvas.height = 1; }
        let empty = stage.querySelector(".empty-pdf");
        if (!empty) {
          empty = document.createElement("div");
          empty.className = "empty-pdf";
           empty.innerHTML = "<div><strong>請先上傳 PDF 講義</strong><span>上傳後就能在頁面上放置多個問答圖釘。</span></div>";
          stage.appendChild(empty);
        }
        return;
      }
      const empty = stage.querySelector(".empty-pdf");
      if (empty) empty.remove();
      canvas.style.display = "block";
      const page = await state.pdf.getPage(state.currentPage);
      if (token !== state.renderToken) return;
      const baseViewport = page.getViewport({ scale: 1 });
      const scroll = document.getElementById("editorPdfScroll") || document.querySelector(".pdf-scroll");
      const availableWidth = Math.max(320, (scroll ? scroll.clientWidth : 820) - 70);
      const baseScale = Math.min(1.5, availableWidth / baseViewport.width);
      const viewport = page.getViewport({ scale: baseScale * state.zoom });
      const outputScale = window.devicePixelRatio || 1;
      canvas.width = Math.floor(viewport.width * outputScale);
      canvas.height = Math.floor(viewport.height * outputScale);
      canvas.style.width = viewport.width + "px";
      canvas.style.height = viewport.height + "px";
      stage.style.width = viewport.width + "px";
      stage.style.height = viewport.height + "px";
      const context = canvas.getContext("2d");
      context.save();
      context.fillStyle = "#fff";
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.restore();
       await page.render({ canvasContext: context, viewport: viewport, transform: outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null }).promise;
      if (token !== state.renderToken) return;
      const layer = document.getElementById("zoneLayer");
      layer.style.width = viewport.width + "px";
      layer.style.height = viewport.height + "px";
      renderTeacherInk();
      renderZones();
      updatePdfToolbar();
    }

    function submissionCountForArea(areaId) {
      return state.submissions.filter(function (item) { return String(item.areaId) === String(areaId); }).length;
    }

    function renderZones() {
      const layer = document.getElementById("zoneLayer");
      if (!layer) return;
      layer.querySelectorAll(".zone").forEach(function (element) { element.remove(); });
      const currentAreas = syncAreaOrder().filter(function (area) { return Number(area.page) === Number(state.currentPage); });

        const zone = document.createElement("button");

        zone.dataset.areaId = area.id;
        zone.style.left = (Number(area.x) * 100) + "%";
        zone.style.top = (Number(area.y) * 100) + "%";
        zone.title = area.title || "問答區 " + (area.order || index + 1);
        zone.setAttribute("aria-label", zone.title);
         zone.innerHTML = "<span class=\"zone-label\">" + (area.order || index + 1) + "</span>" + (state.view === "review" ? "<span class=\"zone-response-count\" aria-hidden=\"true\">" + submissionCountForArea(area.id) + "</span>" : "");
        bindEditorZoneDrag(zone, area);
        zone.addEventListener("click", function (event) {
          event.stopPropagation();

        });
        layer.appendChild(zone);
      });
      updatePdfToolbar();
    }

    function bindEditorZoneDrag(zone, area) {
      if (state.view !== "editor") return;
      let start = null;
      let moved = false;
      zone.addEventListener("pointerdown", function (event) {
        if (!event.isPrimary || state.drawingZone || (event.pointerType === "mouse" && event.button !== 0)) return;
        start = { x: event.clientX, y: event.clientY, areaX: Number(area.x) || 0, areaY: Number(area.y) || 0 };
        moved = false;
        try {
          zone.setPointerCapture(event.pointerId);
        } catch (error) {
          // 沒有有效的 Pointer Capture 時，仍可用一般指標事件拖曳。
        }
      });
      zone.addEventListener("pointermove", function (event) {
        if (!start) return;
        if (!moved && Math.hypot(event.clientX - start.x, event.clientY - start.y) < 4) return;
        moved = true;
        const layer = document.getElementById("zoneLayer");
        const rect = layer && layer.getBoundingClientRect();
        if (!rect || !rect.width || !rect.height) return;
        const maxX = Math.max(0, 1 - (Number(area.width) || .03));
        const maxY = Math.max(0, 1 - (Number(area.height) || .03));
        area.x = clamp((event.clientX - rect.left) / rect.width, 0, maxX);
        area.y = clamp((event.clientY - rect.top) / rect.height, 0, maxY);
        zone.style.left = (area.x * 100) + "%";
        zone.style.top = (area.y * 100) + "%";
        event.preventDefault();
      });
      zone.addEventListener("pointerup", function (event) {
        if (!start) return;
        const wasMoved = moved;
        start = null;
        try {
          if (zone.hasPointerCapture(event.pointerId)) zone.releasePointerCapture(event.pointerId);
        } catch (error) {
          // 沒有有效的 Pointer Capture 時不需要額外處理。
        }
        if (!wasMoved) return;
        zone.dataset.dragged = "1";
        syncAreaOrder();
        renderEditorAreaList();
        showToast("圖釘位置已更新，請儲存版面。", "success");
        window.setTimeout(renderZones, 0);
      });
      zone.addEventListener("pointercancel", function () {
        if (!start) return;
        area.x = start.areaX;
        area.y = start.areaY;
        start = null;
        moved = false;
        zone.style.left = (area.x * 100) + "%";
        zone.style.top = (area.y * 100) + "%";
      });
    }

    async function renderStudentFeedbackPreview(submission) {
      const container = document.getElementById("studentFeedbackPreview");
      const first = state.activeStudentImages[0];
      if (!container || !first) return;
      const feedback = normalizeFeedback(submission.teacherStrokes);
      container.innerHTML = "<img src=\"" + first.dataUrl + "\" alt=\"教師批改後的答案\"><canvas></canvas>";
      const image = container.querySelector("img");
      const canvas = container.querySelector("canvas");
      image.onload = function () { sizeAnnotationCanvas(canvas, image); drawTeacherInkStrokes(canvas, feedback.strokes); };
      if (image.complete) { sizeAnnotationCanvas(canvas, image); drawTeacherInkStrokes(canvas, feedback.strokes); }
    }

    function normalizeFeedback(value) {
      if (Array.isArray(value)) return { photoIndex: 0, strokes: value };
      if (!value || typeof value !== "object") return { photoIndex: 0, strokes: [] };
      return { photoIndex: Number(value.photoIndex) || 0, strokes: Array.isArray(value.strokes) ? value.strokes : [] };
    }

    function sizeAnnotationCanvas(canvas, image) {
      const rect = image.getBoundingClientRect();
      const parentRect = canvas.parentElement.getBoundingClientRect();
      const width = image.clientWidth || rect.width || parentRect.width;
      const height = image.clientHeight || rect.height || parentRect.height;
      const scale = window.devicePixelRatio || 1;
      const targetWidth = Math.max(1, Math.floor(width * scale));
      const targetHeight = Math.max(1, Math.floor(height * scale));
      if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
        canvas.width = targetWidth;
        canvas.height = targetHeight;
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        canvas.dataset.logicalWidth = width;
        canvas.dataset.logicalHeight = height;
      }
    }

    function drawNormalizedStrokes(canvas, strokes) {
      if (!canvas) return;
      const context = canvas.getContext("2d");
      const scale = window.devicePixelRatio || 1;
      context.clearRect(0, 0, canvas.width, canvas.height);
      const logicalWidth = Number(canvas.dataset.logicalWidth || canvas.clientWidth || canvas.width / scale);
      const logicalHeight = Number(canvas.dataset.logicalHeight || canvas.clientHeight || canvas.height / scale);
      context.save();
      context.scale(scale, scale);
      (strokes || []).forEach(function (stroke) {
        if (!stroke.points || stroke.points.length < 1) return;
        context.beginPath();
        context.lineCap = "round";
        context.lineJoin = "round";
        context.strokeStyle = stroke.color || "#d34f42";
        context.lineWidth = Math.max(1, Number(stroke.width || .008) * Math.min(logicalWidth, logicalHeight));
        stroke.points.forEach(function (point, index) {
          const x = Number(point.x || 0) * logicalWidth;
          const y = Number(point.y || 0) * logicalHeight;
          if (index === 0) context.moveTo(x, y); else context.lineTo(x, y);
        });
        context.stroke();
      });
      context.restore();
    }

    async function submitStudentAnswer() {
      const nickname = String(state.nickname || "").trim();
      const textField = document.getElementById("studentTextAnswer");
      if (!nickname) { await showModal("請先填寫暱稱", "教師需要用暱稱辨識你的作答。", "warning"); document.getElementById("studentNicknameField").focus(); return; }
      if (!state.activeAreaId || !textField) return;
      const submission = state.studentSubmissions.get(state.activeAreaId);
      const keepIds = Array.isArray(state.keepStudentImageIds) ? state.keepStudentImageIds : (submission && Array.isArray(submission.imageFileIds) ? submission.imageFileIds.slice(0, MAX_IMAGE_COUNT) : []);
      const keepNames = Array.isArray(state.keepStudentImageNames) ? state.keepStudentImageNames : (submission && Array.isArray(submission.imageFileNames) ? submission.imageFileNames.slice(0, MAX_IMAGE_COUNT) : []);
      if (!textField.value.trim() && (!state.pendingStudentImages || !state.pendingStudentImages.length) && (!keepIds || !keepIds.length)) {
        await showModal("答案還是空的", "請輸入文字或拍照上傳答案。", "warning");
        return;
      }
      const payload = { id: submissionIdFor(state.boardId, state.activeAreaId, nickname), boardId: state.boardId, areaId: state.activeAreaId, nickname: nickname, text: textField.value.trim(), images: state.pendingStudentImages, keepImageFileIds: keepIds, keepImageFileNames: keepNames, clientId: state.clientId, draftKey: state.activeDraftKey };
      try {
        const result = await commitLocalMutation("saveSubmission", payload);
        state.studentSubmissions.set(state.activeAreaId, result.submission);
        await localDelete("drafts", state.activeDraftKey);
        state.pendingStudentImages = [];
        renderStudentAreaList();
        renderZones();
        await renderStudentAnswerPanel();
        showToast(state.demo ? "答案已送出。" : "答案已先儲存在本機，背景同步中。", state.demo ? "success" : "warning");
      } catch (error) {
        await showModal("答案本機保存失敗", error.message || "請稍後再試。", "error");
      }
    }

    function outboxId(action, payload) {
      const data = payload || {};
      const key = data.clientBoardId || data.id || data.submissionId || data.boardId || createId("job");
      return action + "-" + key;
    }

    function nextOutboxSequence() {
      const key = APP_KEY + "outbox_sequence";
      const next = Number(localStorage.getItem(key) || 0) + 1;
      localStorage.setItem(key, String(next));
      return next;
    }

    async function queueOutbox(action, payload, localUpdatedAt) {
      const id = outboxId(action, payload);
      const existing = await localGet("outbox", id);
      await localPut("outbox", { id: id, action: action, payload: payload, createdAt: existing ? existing.createdAt : new Date().toISOString(), sequence: nextOutboxSequence(), attempts: 0, nextAttemptAt: 0, localUpdatedAt: localUpdatedAt || new Date().toISOString() });
    }

    async function prepareQueuedPayload(item) {
      const payload = Object.assign({}, item.payload || {});
      if (item.action !== "saveSubmission") return payload;
      const localSubmission = await localGet("submissions", payload.id);
      if (!localSubmission) return payload;
      payload.boardId = localSubmission.boardId || payload.boardId;
      payload.areaId = localSubmission.areaId || payload.areaId;
      payload.nickname = localSubmission.nickname || payload.nickname;
      payload.text = localSubmission.text || "";
      payload.clientId = localSubmission.clientId || payload.clientId;
      const ids = Array.isArray(localSubmission.imageFileIds) ? localSubmission.imageFileIds : [];
      const names = Array.isArray(localSubmission.imageFileNames) ? localSubmission.imageFileNames : [];
      const localIds = new Set(ids.filter(function (id) { return String(id).indexOf("L-") === 0; }).map(String));
      const serverIds = [];
      const serverNames = [];
      ids.forEach(function (id, index) {
        if (String(id).indexOf("L-") !== 0) {
          serverIds.push(id);
          serverNames.push(names[index] || "答案照片.jpg");
        }
      });
      const localImages = (await Promise.all(Array.from(localIds).map(function (lid) { return localGet("files", lid); }))).filter(function (file) { return file && file.dataUrl; }).map(function (file) { return { name: file.name || "答案照片.jpg", mime: file.mime || "image/jpeg", data: file.dataUrl }; });
      payload.keepImageFileIds = serverIds;
      payload.keepImageFileNames = serverNames;
      payload.images = localImages.length ? localImages : (Array.isArray(payload.images) ? payload.images : []);
      return payload;
    }

    async function localRecordForOutbox(item) {
      const payload = item.payload || {};
      if (item.action === "saveInk") return localGet("ink", payload.id);
      if (item.action === "saveClassroomState") return localGet("classroomState", payload.id);
      if (item.action === "saveSubmission" || item.action === "saveFeedback") return localGet("submissions", payload.id || payload.submissionId);
      if (item.action === "createBoard" || item.action === "updateBoard" || item.action === "archiveBoard") return localGet("boards", payload.clientBoardId || payload.boardId);
      return null;
    }

    async function localMutationIsNewer(item) {
      if (!item.localUpdatedAt) return false;
      const local = await localRecordForOutbox(item);
      return Boolean(local && local.updatedAt && String(local.updatedAt) > String(item.localUpdatedAt));
    }

    async function isCurrentOutboxItem(item) {
      const latest = await localGet("outbox", item.id);
      return !latest || Number(latest.sequence || 0) === Number(item.sequence || 0);
    }

    async function applyRemoteMutationResult(item, result) {
      if (await localMutationIsNewer(item)) return;
      const payload = item.payload || {};
      if (item.action === "saveSubmission" && result.submission) {
        await localPut("submissions", result.submission);
        if (payload.draftKey) await localDelete("drafts", payload.draftKey);
        if (state.view === "student" && String(payload.boardId) === String(state.boardId) && String(payload.nickname) === String(state.nickname)) {
          state.studentSubmissions.set(result.submission.areaId, result.submission);
          if (state.activeAreaId === result.submission.areaId) {
            state.pendingStudentImages = [];
            await renderStudentAnswerPanel();
          }
          renderStudentAreaList();
          renderZones();
        }
      } else if ((item.action === "createBoard" || item.action === "updateBoard") && result.board) {
        const local = await localGet("boards", result.board.id || payload.boardId);
        await localPut("boards", Object.assign({}, local || {}, result.board, { areas: local && local.areas ? local.areas : (result.areas || []) }));
      }
    }

    async function flushOutbox() {
      if (state.demo || !GAS_URL || !navigator.onLine || state.flushBusy) return;
      state.flushBusy = true;
      try {
        const items = (await localAll("outbox")).sort(function (a, b) { return (Number(a.sequence) || Date.parse(a.createdAt) || 0) - (Number(b.sequence) || Date.parse(b.createdAt) || 0); });
        for (const item of items) {
          if (!(await isCurrentOutboxItem(item))) continue;
          if (Number(item.nextAttemptAt || 0) > Date.now()) continue;
          try {
            const queuedPayload = await prepareQueuedPayload(item);
            if (!(await isCurrentOutboxItem(item))) continue;
            const payload = Object.assign({}, queuedPayload, state.adminToken ? { adminToken: state.adminToken } : {});
            const result = await gasPost(item.action, payload);
            await applyRemoteMutationResult(item, result);
            if (await isCurrentOutboxItem(item)) await localDelete("outbox", item.id);
          } catch (error) {
            if (!(await isCurrentOutboxItem(item))) continue;
            const attempts = Number(item.attempts || 0) + 1;
            item.attempts = attempts;
            item.nextAttemptAt = Date.now() + Math.min(60000, 1000 * Math.pow(2, Math.min(attempts - 1, 6)));
            item.lastError = String(error.message || error);
            await localPut("outbox", item);
            if (attempts === 1) showToast("背景同步暫停，資料仍保留在本機。", "warning");
          }
        }
        const pending = await localAll("outbox");
        if (pending.length && !state.outboxRetryTimer) {
          const nextAttemptAt = Math.min.apply(null, pending.map(function (item) { return Number(item.nextAttemptAt || Date.now()); }));
          state.outboxRetryTimer = window.setTimeout(function () {
            state.outboxRetryTimer = null;
            flushOutbox();
          }, Math.max(500, nextAttemptAt - Date.now()));
        }
      } finally {
        state.flushBusy = false;
      }
    }

    function bindReviewModalSwipe(element) {
      if (!element || element.dataset.swipeBound === "1") return;
      element.dataset.swipeBound = "1";
      let startX = 0;
      let startY = 0;
      let isSwiping = false;

      element.addEventListener("touchstart", function (event) {
        if (event.touches.length !== 1) return;
        const target = event.target;
        if (target && (target.id === "reviewCanvas" || target.closest("textarea, input, select, button"))) return;
        startX = event.touches[0].clientX;
        startY = event.touches[0].clientY;
        isSwiping = true;
      }, { passive: true });

      element.addEventListener("touchend", function (event) {
        if (!isSwiping) return;
        isSwiping = false;
        const touch = event.changedTouches[0];
        if (!touch) return;
        const diffX = touch.clientX - startX;
        const diffY = touch.clientY - startY;
        if (Math.abs(diffX) > 40 && Math.abs(diffX) > Math.abs(diffY) * 1.4) {
          if (diffX < 0) moveReviewSubmission(1);
          else moveReviewSubmission(-1);
        }
      }, { passive: true });
    }
